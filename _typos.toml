[default.extend-words]
# Fragments from hyphenated tokens that typos splits (e.g. "CC-BY-ND").
nd = "nd"
# The GNU toolchain's Windows runtime DLL, `libgcc_s_seh-1.dll` (SEH:
# structured exception handling).
seh = "seh"
# Shepperd's method: a quaternion from a rotation matrix, named after
# Stanley W. Shepperd (ticket 3112).
shepperd = "shepperd"
# The `flate2` crate, which `shuyi export`'s archives deflate with.
flate = "flate"
# `lune-caf`, the crate name `shuyi new` makes of "Lune Café", the
# tests' game name beyond ASCII.
caf = "caf"

[files]
extend-exclude = [
    # Standard license texts, never edited.
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "*-LICENSE*.txt",
    # The Terminus font of Hello, Grid and the atlas made from it.
    "examples/hello-grid/files-src/*.bdf",
    "examples/hello-grid/files/font/atlas.ron",
    "templates/shuyi-default/base/crates/game/files/font/atlas.ron",
    # Vendored JavaScript (THIRD_PARTY_ASSETS.md), never edited by hand.
    "crates/cli/web/mq_js_bundle.js",
    "crates/cli/web/quad-storage.js",
    "crates/cli/web/sapp_jsutils.js",
    # The engine's template's plans: hashes, written by a test.
    "crates/cli/src/template/plans.golden",
    # The contract's schemas by version: hashes, as `cargo shuyi schema`
    # prints them.
    "crates/cli/schemas/versions.json",
    # Golden tables (`shuyi_assets::golden`): hashes, written by
    # `cargo xtask golden --bless`.
    "**/tests/golden/*.ron",
    # proptest's saved failing cases.
    "proptest-regressions/",
    # The web checker's pinned Python packages: hashes, made by pip-compile.
    "tools/web-check/requirements.txt",
]
