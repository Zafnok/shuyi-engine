[workspace]
members = ["crates/*", "examples/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
# Not on crates.io yet: games depend on a git revision (README.md).
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/Zafnok/shuyi-engine"

[workspace.dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# `ron` and `thiserror` without `std` for the Playdate build (game
# ADR-0070 §3); a crate that needs their `std` turns it on.
ron = { version = "0.12", default-features = false }
include_dir = "0.7"
thiserror = { version = "2", default-features = false }
once_cell = { version = "1", default-features = false, features = ["race", "alloc"] }
libm = "0.2"
proptest = "1"
insta = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Less debug info in dev and test builds (`test` inherits `dev`). On the
# GNU Windows toolchain the debug info is inside each `.exe`. Line tables
# are enough for panics and backtraces to name file:line; third-party
# crates get none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
