[workspace]
members = ["crates/*", "crates/embed/fixture", "examples/*", "site/snippets"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
# Not on crates.io yet: games depend on a git revision (README.md).
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/Zafnok/shuyi-engine"

[workspace.dependencies]
# Each engine crate another depends on (cargo warns on an entry no member
# uses), pinned to exactly the workspace's version, so a
# game never resolves a mixed set (ADR-0152). Defaults off: a member that
# takes them says `features = ["default", ...]`, since cargo ignores a
# member's `default-features = false` when this entry turns them on.
# Dev-dependencies stay path-only, so cargo leaves them out of a package.
# `cargo xtask check-publish` holds all of this.
shuyi-alloc-count = { path = "crates/alloc-count", version = "=0.1.0", default-features = false }
shuyi-app = { path = "crates/app", version = "=0.1.0", default-features = false }
shuyi-assets = { path = "crates/assets", version = "=0.1.0", default-features = false }
shuyi-core = { path = "crates/core", version = "=0.1.0", default-features = false }
shuyi-embed = { path = "crates/embed", version = "=0.1.0", default-features = false }
shuyi-embed-macros = { path = "crates/embed-macros", version = "=0.1.0", default-features = false }
shuyi-platform = { path = "crates/platform", version = "=0.1.0", default-features = false }
shuyi-script = { path = "crates/script", version = "=0.1.0", default-features = false }
shuyi-sound = { path = "crates/sound", version = "=0.1.0", default-features = false }
shuyi-sound-out = { path = "crates/sound-out", version = "=0.1.0", default-features = false }
shuyi-ui = { path = "crates/ui", version = "=0.1.0", default-features = false }
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# `ron` and `thiserror` without `std` for the Playdate build (game
# ADR-0070 §3); a crate that needs their `std` turns it on.
ron = { version = "0.12", default-features = false }
thiserror = { version = "2", default-features = false }
once_cell = { version = "1", default-features = false, features = ["race", "alloc"] }
libm = "0.2"
# Without `fork` and `timeout`, which no test uses: their `wait-timeout`
# doesn't build for WASI, where CI's `determinism` job runs the tests
# (ticket 2116).
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
insta = "1"
# A game's types describe their shapes for its tools (ADR-0084 §2): a
# game's `tools` feature turns it on, with `shuyi/schema`.
schemars = { version = "1", default-features = false, features = ["derive"] }

# Cargo allows one crate of a build to say `links = "alsa"`, on any target, and
# quad-snd and CPAL each bring one. While both are here this holds CPAL's place, and
# CPAL is built only for Windows (ADR-0075). Ticket 3079 takes it out.
[patch.crates-io]
alsa-sys = { path = "tools/sound-parity/alsa-sys-held" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# `cargo llvm-cov` sets `cfg(coverage)` (ticket 3070).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Less debug info in dev and test builds (`test` inherits `dev`). On the
# GNU Windows toolchain the debug info is inside each `.exe`. Third-party
# crates get none, and the linker strips the line tables from every
# program (ticket 2077: a worktree's test programs, a third smaller).
# A panic still names its file:line (it is compiled in); backtrace frames
# keep their function names and lose file:line.
[profile.dev]
debug = "line-tables-only"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
debug = false

# shuyi-cli's programs keep their DWARF: its crash tests read a
# backtrace's file:line from it (ticket 2520).
[profile.dev.package.shuyi-cli]
strip = "none"
