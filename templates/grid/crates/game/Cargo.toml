[package]
name = "{{crate}}"
description = "{{name}}: a turn-based game on Shuyi Engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The game's code calls it `game` whatever the game is called.
name = "game"

[[bin]]
name = "{{crate}}"
path = "src/main.rs"

[[example]]
# The game's tool program: `cargo shuyi <command>` runs it (shuyi.ron).
name = "tools"
required-features = ["tools"]

[lints]
workspace = true

[features]
# `tools`: the game's tools for the engine's `shuyi` (`game::tools`), for
# its tool program and its tests.
tools = ["dep:shuyi-cli"]

[dependencies]
rules = { package = "{{crate}}-rules", path = "../rules" }
# The engine: its crates as `shuyi::core`, `shuyi::ui` and the rest (how
# the game starts, the macroquad backend: the window, input devices, audio
# and storage), and the modules it turns on.
shuyi.workspace = true
shuyi-cli = { workspace = true, optional = true }
# The entry point: `#[macroquad::main]` has to be in the binary.
macroquad.workspace = true
serde.workspace = true
ron.workspace = true
# The files under `files/`, embedded.
include_dir.workspace = true

[dev-dependencies]
# The Harness and the tools, for the tests in tests/.
"{{crate}}" = { path = ".", features = ["tools"] }
