name: CI

# The gates (AGENTS.md): tests are the review. Commit Cargo.lock and add
# `--locked` to the cargo commands once the game has one.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Every error in the game's files
        run: cargo shuyi check
      - name: The game fits every target it ships on
        run: cargo shuyi check --target all
      - name: No key hard-coded in code or text
        run: cargo shuyi check-keys
      - name: No key, no screen text in the code, and the rules kept pure
        run: cargo shuyi lint
