# {{name}}: a game on Shuyi Engine, made with `shuyi new grid`.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# The engine's crates. Until its first release on crates.io a game
# depends on the engine's repository at a commit (its README).
shuyi-core = "{{engine.core}}"
shuyi-assets = "{{engine.assets}}"
shuyi-ui = "{{engine.ui}}"
shuyi-app = "{{engine.app}}"
shuyi-cli = "{{engine.cli}}"
# The window and the entry point, as the engine has them.
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
include_dir = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Less debug info in dev and test builds; the engine and the other crates
# are built optimized, so the game runs at speed in a debug build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
