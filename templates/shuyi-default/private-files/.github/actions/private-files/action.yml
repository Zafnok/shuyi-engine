name: Private files
description: >-
  Checks out files/ of the game's private repository into private/, at the
  commit private.rev names, so the gates build and test the real game (the
  engine's ADR-0111): the build lays private/files/ over crates/game/files/
  whenever it is there. Run it after the repository's own checkout and
  before the first cargo command. A run on the game's own repository fails
  without the key; a fork's pull request, which gets no secrets, warns and
  builds on the public files. Never upload an artifact that embeds the
  private files: anyone signed in to GitHub can download a public
  repository's artifacts.

inputs:
  key:
    description: >-
      secrets.PRIVATE_ASSETS_KEY: the private half of a read-only deploy key
      of the private repository (`shuyi repos` makes it). Empty on a fork's
      pull request. Dependabot's runs get only Dependabot secrets: `shuyi
      repos` sets a Dependabot secret of the same name, read here the same
      way.
    required: false
    default: ""
  required:
    description: >-
      Whether a run on the game's own repository without the key fails:
      "true" but on a release's dry run (the release workflow's
      workflow_dispatch), which warns and builds on the public files.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Decide what this run checks out
      id: plan
      shell: bash
      env:
        HAS_KEY: ${{ inputs.key != '' }}
        REQUIRED: ${{ inputs.required }}
        FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        OWNER: ${{ github.repository_owner }}
        URL: "{{private_url}}"
      run: |
        set -euo pipefail
        repository=${URL#https://github.com/}
        repository=${repository%.git}
        private_owner=${repository%%/*}
        if [ "$HAS_KEY" != "true" ]; then
          if [ "$FORK_PR" = "true" ] || [ "${OWNER,,}" != "${private_owner,,}" ] || [ "$REQUIRED" != "true" ]; then
            echo "::warning::This run can't read the private repository $repository (a fork's pull request, a copy of the game or a dry run has no key to it): the gates run on the public files."
            exit 0
          fi
          echo "::error::The secret PRIVATE_ASSETS_KEY is missing, so the gates can't read the private repository $repository. Run \`shuyi repos\` in the game's folder: it makes the read-only deploy key and sets the secret, for Actions and for Dependabot."
          exit 1
        fi
        rev=""
        if [ -f private.rev ]; then
          rev=$(tr -d '[:space:]' < private.rev)
        fi
        if [ -z "$rev" ]; then
          echo "::error::private.rev: no pin yet: push the private repository's first commit, then run \`cargo shuyi private-assets --pin\` and commit private.rev."
          exit 1
        fi
        if ! [[ "$rev" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::private.rev: expected a 40-character commit id, found \`$rev\`: run \`cargo shuyi private-assets --pin\`."
          exit 1
        fi
        echo "The private repository $repository: checking out files/ at $rev"
        {
          echo "repository=$repository"
          echo "rev=$rev"
        } >> "$GITHUB_OUTPUT"
    - name: Check out the private files
      if: steps.plan.outputs.rev != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.plan.outputs.repository }}
        ref: ${{ steps.plan.outputs.rev }}
        ssh-key: ${{ inputs.key }}
        path: private
        sparse-checkout: files
        persist-credentials: false
    - name: Count the private files
      if: steps.plan.outputs.rev != ''
      shell: bash
      run: |
        set -euo pipefail
        # A pin from before the private repository had files/ would build
        # quietly on the public files.
        if [ ! -d private/files ]; then
          echo "::error::private.rev names a commit of the private repository without files/."
          exit 1
        fi
        echo "Private files: $(find private/files -type f | wc -l)"
