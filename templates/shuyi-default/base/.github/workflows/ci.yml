name: CI

# The gates (AGENTS.md): tests are the review. Commit Cargo.lock and add
# `--locked` to the cargo commands once the game has one.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Every error in the game's files
        run: cargo shuyi check
      - name: The game fits every target it ships on
        run: cargo shuyi check --target all
      - name: No key hard-coded in code or text
        run: cargo shuyi check-keys
      - name: No key, no screen text in the code, and the rules kept pure
        run: cargo shuyi lint
