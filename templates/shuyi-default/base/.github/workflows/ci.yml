name: CI

# The gates (AGENTS.md): tests are the review. Commit Cargo.lock and add
# `--locked` to the cargo commands once the game has one.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A game with private files (`shuyi.ron`'s `private_assets`) checks
      # them out over its own before any cargo command, so the gates read
      # the real game: the build lays `private/files/` over
      # `crates/game/files/` whenever it is there. Its action fails a run
      # on the game's own repository without the secret, and warns on a
      # fork's pull request, which builds on the public files. Dependabot's
      # runs get only Dependabot secrets: `shuyi repos` sets one of the same
      # name. No step may upload an artifact that embeds them.
      - name: The private files
        if: hashFiles('.github/actions/private-files/action.yml') != ''
        uses: ./.github/actions/private-files
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
      - run: rustup show
      # No cache may embed the private files either: `target/` holds builds
      # that do, and a pull request's run, a fork's too, may restore its
      # base branch's caches. A game with private files caches only the
      # cargo registry, as the engine's playtest workflow does.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: ${{ hashFiles('.github/actions/private-files/action.yml') == '' }}
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Every error in the game's files
        run: cargo shuyi check
      - name: The game fits every target it ships on
        run: cargo shuyi check --target all
      - name: No key hard-coded in code or text
        run: cargo shuyi check-keys
      - name: No key, no screen text in the code, and the rules kept pure
        run: cargo shuyi lint
