name: Release

# A pushed tag `vX.Y.Z` releases the game (README.md, "Releasing"): the
# gates (ci.yml), then every package `cargo shuyi export --plan` says CI
# builds, each on its own runner (export.yml), then a GitHub Release of the
# tag with every package and SHA256SUMS and, on a public repository,
# attestations of where each was built. It publishes nowhere until the
# developer says where (the engine's decision of 2026-11-18, ADR-0133):
#
# - the release is a draft, which only people who can change the game see,
#   unless the repository variable PUBLISH_ON_GITHUB is `true` (a public
#   download for anyone) or the repository is private;
# - with the repository variable ITCH_GAME (`user/game`) and the secret
#   BUTLER_API_KEY, each package but a prerelease's is pushed to itch.io;
# - the debug files go in a draft of their own, `<tag>-debug`, which
#   nothing publishes: `gh release download <tag>-debug` fetches them.
#
# Run it from the Actions tab (workflow_dispatch) for a dry run: the gates,
# the plan and the packages, with no release and nothing pushed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates
    uses: ./.github/workflows/ci.yml
    secrets:
      PRIVATE_ASSETS_KEY: ${{ secrets.PRIVATE_ASSETS_KEY }}

  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      # The plan reads shuyi.ron's `targets`: each exporter's runner, image
      # and whether CI builds it. On a tag, it fails unless the tag is `v`
      # and the game's version.
      - name: Plan the packages
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(export --plan --json)
          if [ "$EVENT" = push ]; then
            args+=(--tag "$TAG")
          fi
          if ! cargo shuyi "${args[@]}" > plan.json; then
            jq -r '"::error::export --plan: \(.error // "failed")", (.help // empty)' plan.json || cat plan.json
            exit 1
          fi
          matrix=$(jq -c '{include: [.result.exports[] | select(.ci == "build") | {target: .exporter, host, container: (.container // "")}]}' plan.json)
          if [ "$(jq '.include | length' <<< "$matrix")" = 0 ]; then
            echo "::error::export --plan lists no package CI builds: shuyi.ron's \`targets\` needs one an exporter builds (desktop, web)"
            exit 1
          fi
          {
            echo "matrix=$matrix"
            echo "version=$(jq -r .result.version plan.json)"
            echo "prerelease=$(jq -r .result.prerelease plan.json)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### The packages of version $(jq -r .result.version plan.json)"
            echo
            jq -r '.result.exports[] | if .ci == "build" then "- `\(.exporter)`: built on \(.host)" else "- `\(.exporter)`: checked only, \(.why)" end' plan.json
            jq -r '.limits[] | "- \(.)"' plan.json
          } >> "$GITHUB_STEP_SUMMARY"

  export:
    name: export (${{ matrix.target }})
    needs: [gates, plan]
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/export.yml
    with:
      target: ${{ matrix.target }}
      host: ${{ matrix.host }}
      container: ${{ matrix.container }}
      private-files-required: ${{ github.event_name == 'push' }}
      upload-private: ${{ github.event_name == 'push' || github.event.repository.private }}
    secrets:
      PRIVATE_ASSETS_KEY: ${{ secrets.PRIVATE_ASSETS_KEY }}

  release:
    name: release
    needs: [plan, export]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      CRATE: "{{crate_name}}"
      # A public release on GitHub only when the developer asks for one, or
      # in a private repository, whose releases are private.
      PUBLISH: ${{ vars.PUBLISH_ON_GITHUB == 'true' || github.event.repository.private }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: artifacts
      # A public repository's package with the private files comes sealed
      # (export.yml), opened here with the same key.
      - name: Open the sealed files
        env:
          PRIVATE_ASSETS_KEY: ${{ secrets.PRIVATE_ASSETS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_ASSETS_KEY" ] && [ -n "$(find artifacts -type f -name '*.sealed')" ]; then
            echo "::error::The packages are sealed, but the secret PRIVATE_ASSETS_KEY is missing: run \`shuyi repos\` in the game's folder."
            exit 1
          fi
          find artifacts -type f -name '*.sealed' -print0 | while IFS= read -r -d '' file; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 \
              -pass env:PRIVATE_ASSETS_KEY -in "$file" -out "${file%.sealed}"
            rm "$file"
          done
      # Each package (`<crate>-<version>-<exporter>.<ext>`) in release/, and
      # each debug file in debug/: a debug file is the program before
      # stripping, for crash reports, and is never published.
      - name: The files and their checksums
        run: |
          set -euo pipefail
          mkdir release debug
          find artifacts -type f -name '*.debug' -exec mv -n {} debug/ \;
          find artifacts -type f ! -name '*.json' -exec mv -n {} release/ \;
          (cd release && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS release/
          cat release/SHA256SUMS
          if [ -n "$(ls -A debug)" ]; then
            (cd debug && sha256sum -- *) > debug-sums
            mv debug-sums debug/SHA256SUMS
          fi
      # Where each package was built, which `gh attestation verify <file>
      # --repo <owner>/<repo>` checks. A private repository needs GitHub
      # Enterprise Cloud for them.
      - name: Attest the files
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: No attestations
        if: ${{ github.event.repository.private }}
        run: |
          echo "No attestations: a private repository needs GitHub Enterprise Cloud for them." >> "$GITHUB_STEP_SUMMARY"
      # The notes are the annotated tag's message, read through the API: a
      # checkout can fetch an annotated tag as a plain one.
      - name: The notes
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG")
          notes=""
          if [ "$(jq -r .object.type <<< "$ref")" = tag ]; then
            notes=$(gh api "repos/$GH_REPO/git/tags/$(jq -r .object.sha <<< "$ref")" --jq .message)
          fi
          if [ -z "$notes" ]; then
            notes="$CRATE $VERSION"
          fi
          printf '%s\n' "$notes" > notes.md
      # The debug files, in a draft only people who can change the game see,
      # which nothing publishes. A re-run replaces its files.
      - name: The debug files' draft
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(debug/*)
          if [ "${#files[@]}" = 0 ]; then
            echo "No debug files." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          draft="$TAG-debug"
          if gh release view "$draft" > /dev/null 2>&1; then
            gh release upload "$draft" --clobber "${files[@]}"
          else
            gh release create "$draft" --draft --target "$GITHUB_SHA" \
              --title "Debug files of $TAG: never publish" \
              --notes "The debug files of $TAG's packages, for crash reports: \`gh release download $draft\`. A debug file is the program before stripping: never publish this draft." \
              "${files[@]}"
          fi
          echo "Debug files: the draft \`$draft\` (\`gh release download $draft\`)." >> "$GITHUB_STEP_SUMMARY"
      - name: Release
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          if [ "$PUBLISH" != true ]; then
            flags+=(--draft)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber release/*
          else
            gh release create "$TAG" --verify-tag --notes-file notes.md "${flags[@]}" release/*
          fi
          if [ "$PUBLISH" = true ]; then
            echo "The release of $TAG is published on GitHub." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The release of $TAG is a draft: only people who can change the game see it. Publish it on GitHub by hand, or set the repository variable PUBLISH_ON_GITHUB to \`true\` for every release." >> "$GITHUB_STEP_SUMMARY"
          fi

  itch:
    name: itch.io
    needs: [plan, release]
    if: github.event_name == 'push' && vars.ITCH_GAME != '' && needs.plan.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    env:
      ITCH_GAME: ${{ vars.ITCH_GAME }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: artifacts
      # As the release job does.
      - name: Open the sealed files
        env:
          PRIVATE_ASSETS_KEY: ${{ secrets.PRIVATE_ASSETS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_ASSETS_KEY" ] && [ -n "$(find artifacts -type f -name '*.sealed')" ]; then
            echo "::error::The packages are sealed, but the secret PRIVATE_ASSETS_KEY is missing: run \`shuyi repos\` in the game's folder."
            exit 1
          fi
          find artifacts -type f -name '*.sealed' -print0 | while IFS= read -r -d '' file; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 \
              -pass env:PRIVATE_ASSETS_KEY -in "$file" -out "${file%.sealed}"
            rm "$file"
          done
      # butler (MIT), from its GitHub release; the release publishes no
      # checksum file, so the zip's SHA-256 is written here.
      - name: Install butler
        env:
          BUTLER_VERSION: 15.32.0
          BUTLER_SHA256: 5db7b053fc9b578b86ffaf3520a12b952eb95c9225171cc5720dfbc9fe4574b3
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/butler.zip" "https://github.com/itchio/butler/releases/download/v$BUTLER_VERSION/butler-linux-amd64.zip"
          echo "$BUTLER_SHA256  $RUNNER_TEMP/butler.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      # One channel per exporter (itch.io tags `windows`, `linux` and
      # `macos` by their names), the Steam Deck's excepted: its package is
      # for Steam. Never a debug file.
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::ITCH_GAME is set, but the secret BUTLER_API_KEY is missing: make a key with \`butler login\` (or on itch.io, API keys) and add it as a repository secret"
            exit 1
          fi
          for dir in artifacts/package-*; do
            exporter=${dir#artifacts/package-}
            if [ "$exporter" = steam-deck ]; then
              continue
            fi
            package=$(find "$dir" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -n 1)
            unpacked="$RUNNER_TEMP/itch/$exporter"
            mkdir -p "$unpacked"
            case "$package" in
              *.zip) unzip -q "$package" -d "$unpacked" ;;
              *.tar.gz) tar -xzf "$package" -C "$unpacked" ;;
              *)
                echo "::error::$dir holds no package (a zip or a tar.gz)"
                exit 1
                ;;
            esac
            butler push "$unpacked" "$ITCH_GAME:$exporter" --userversion "$VERSION" --if-changed
          done
