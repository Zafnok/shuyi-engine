name: Playtest

# The game's bots play every stage (`cargo shuyi playtest --every-stage`)
# when a file that decides how the game plays changed: by default every
# file but `*.md`, `docs/` and `tickets/`. The report is in the job's
# summary; the job fails only when a bot falls under its floor
# (playtest.ron) or the playtest breaks. The engine's reusable workflow
# does it; its inputs are in the engine's docs/contract.md (`playtest`).
#
# The stage's plan is a plain bot run (its tools' `playtest_plan`): it
# judges nothing, and fails only when a try breaks, until the game gives
# it checks (a playtest.ron: the shuyi-balance-bots skill).
#
# The pin is the engine's commit the game builds with: move it with the
# engine's `rev` in Cargo.toml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs cancel each other; a push's never is, or its
# changes go unplayed.
concurrency:
  group: playtest-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  playtest:
    name: playtest
    uses: Zafnok/shuyi-engine/.github/workflows/playtest.yml@{{engine_ref}} # the engine's commit
    # The key to the private files, when the game has them (the engine's
    # ADR-0111): its bots play the real game. Passed by name, never
    # every secret the game has; empty, and unused, in a game without them.
    secrets:
      PRIVATE_ASSETS_KEY: ${{ secrets.PRIVATE_ASSETS_KEY }}
