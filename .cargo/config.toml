[alias]
# The engine's tools (`crates/cli`, binary `shuyi`), on the project of the
# `shuyi.ron` in the working folder or above it.
shuyi = "run -q -p shuyi-cli --"

# The repository's own tools (`crates/xtask`, ticket 2002): `ticket-lint`
# and `check-links`.
xtask = "run -q -p xtask --"

# rustup's self-contained x86_64-pc-windows-gnu linker ships without a full
# mingw-w64 import library set (e.g. no libimm32.a, which macroquad needs for
# IME support). Use a full MSYS2 mingw-w64 toolchain instead. Install with:
#   winget install -e --id MSYS2.MSYS2
#   C:\msys64\usr\bin\pacman.exe -S mingw-w64-x86_64-gcc
[target.x86_64-pc-windows-gnu]
linker = "C:/msys64/mingw64/bin/gcc.exe"
ar = "C:/msys64/mingw64/bin/ar.exe"

# The wasm32 `--allow-undefined` linker flag a game's binary needs for the
# web shell's JS plugins lives in its `build.rs` (`examples/hello-grid`,
# `crates/cli/web/README.md`): a `RUSTFLAGS` env var (CI sets one, for
# `-D warnings`) replaces this file's `rustflags` instead of adding to them.
