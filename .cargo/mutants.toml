# The platform shell (`crates/app`) drives a window, a sound device and
# controllers, which no test has; mutants leave it out, and the examples'
# binaries (`src/main.rs`, which hand the example to the shell).
#
# `keymap/sample.rs` is a sample game's actions, test data for the keymap
# format's and input's tests, built only for tests; so is `shuyi-ui`'s toy
# game (`toy.rs` and its grid map in `toy/`), which the tests of the
# screens, the context, the frame loop and the grid run on. `shuyi-cli`'s
# toy tools (`toy.rs`) are that toy's `frame-png` and `lang-status`, for
# the tool's own tests.
exclude_globs = [
    "crates/app/**",
    "examples/*/src/main.rs",
    "crates/assets/src/keymap/sample.rs",
    "crates/ui/src/toy.rs",
    "crates/ui/src/toy/**",
    "crates/cli/src/toy.rs",
]
timeout_multiplier = 3.0
# Mutants no test can catch, each for the reason beside it:
exclude_re = [
    # `NoDirective` has no values, so its `print` can never run.
    "<impl Directive for NoDirective>::print",
    # The default `scene_problems` is `Vec::new()`: its only viable mutant,
    # `vec![]`, is the same function.
    "SceneRules::scene_problems",
    # The default `Session::log` is `Vec::new()`: its only viable mutant,
    # `vec![]`, is the same function.
    "replace Session::log -> Vec<LogEntry>",
    # The default `Session::modules` is `Vec::new()`: its only viable
    # mutant, `vec![]`, is the same function.
    "replace Session::modules -> Vec<ModuleEntry>",
    # The default `audio_config` is `AudioConfig::DEFAULT`, which is also
    # `AudioConfig::default()`: its only mutant is the same function.
    "GameData::audio_config",
    # `Plain` has no lines of its own (`NoDirective` has no values), so its
    # `direct` can never run.
    "<impl DialogueHooks for Plain>::direct",
    # `web`'s real `wasm-opt` is an optional tool no test machine is sure
    # to have; the logic around it runs on a fake.
    "<impl WasmOpt for RealWasmOpt>::optimize",
    # The ticket lint's call to `gh api` needs `gh` signed in to the private
    # game repository, which no test machine is sure to have; what it does
    # with `gh`'s answer is `gh_listing`, tested on its own.
    "list_on_github",
    # Hello, Grid has no voices: `OnlyClip` has one value, which is its
    # default, and no split variants, so `voice_variant`'s and `split`'s
    # only mutants are the same functions.
    "<impl GameData for Hello>::voice_variant",
    "<impl ClipVariant for OnlyClip>::split",
    # Hello, Grid's files are embedded and load without an error, so its
    # tools' `check` is `Ok(vec![])`: that mutant is the same function.
    "<impl GameTools for HelloTools>::check",
    # The default `Format::sniff` is `false` (a format with no magic bytes
    # knows no file by them): its `false` mutant is the same function. Its
    # `true` mutant is caught.
    'replace Format::sniff -> bool with false',
    # A one-bit picture claims no extension (`&[]`): the mutant that returns
    # an empty leaked `Vec` is the same function. Its other mutants are
    # caught.
    'OneBitInfo>::extensions -> .* with Vec::leak\(Vec::new\(\)\)',
    # A baked file's format claims no extension either (`&[]`), with the
    # same mutant.
    'Packed<K>>::extensions -> .* with Vec::leak\(Vec::new\(\)\)',
    # A grid skin has no zoom levels unless it says (`&[]`): the mutant that
    # returns an empty leaked `Vec` is the same function. Its other mutants
    # are caught.
    'GridSkin::zoom_levels -> .* with Vec::leak\(Vec::new\(\)\)',
    # The default `playtest_stages` is `Vec::new()`: its only viable
    # mutant, `vec![]`, is the same function.
    'replace GameTools::playtest_stages -> Vec<String> with vec!\[\]',
    # The pool skips an item past the earliest failure (`i > failed`). An
    # item's index is checked once, before it runs, and only a run item
    # fails, so `i` never equals `failed` there: `>=` is the same test.
    'pool\.rs:\d+:\d+: replace > with >= in run',
    # The MCP server's game tool program is ended when the server drops it:
    # a process killed and reaped leaves nothing a test can read (it would
    # end anyway once its stdin closes).
    "<impl Drop for Program>::drop",
    # A server moves its own program aside on Windows only, and mutants run
    # on Linux, where nothing calls `this_program`. What it does is
    # `move_aside`, tested on its own; the call is tested on Windows
    # (`a_running_server_moves_its_program_aside_…` in `tests/it/binary.rs`).
    "replace this_program with \\(\\)",
    # The default `theme_def` is `None` (one palette): its `None` mutant is
    # the same function. Its other mutant is caught.
    'replace GameData::theme_def -> .* with None',
    # The default `voice_variant` is the variant's default: its
    # `Default::default()` mutant is the same function.
    'replace GameData::voice_variant -> Self::Voice with Default::default\(\)',
    # `()` has no split variants (`&[]`): the mutant that returns an empty
    # leaked `Vec` is the same function. Its other mutant is caught.
    '<impl ClipVariant for \(\)>::split -> .* with Vec::leak\(Vec::new\(\)\)',
    # `BasicData` has no sounds: its manifest is always the default, so the
    # mutant that returns a leaked default is the same function.
    '<impl GameData for BasicData<A, T>>::audio_manifest -> .* with Box::leak\(Box::new\(Default::default\(\)\)\)',
    # `BasicTools` has no frame options (`&[]`): the mutant that returns an
    # empty leaked `Vec` is the same function.
    '<impl GameTools for BasicTools<A, T>>::frame_options -> .* with Vec::leak\(Vec::new\(\)\)',
    # The `shuyi` crate has no module yet, so `enabled_modules` is
    # `Vec::new()`: its `vec![]` mutant is the same function. The first
    # module's feature removes this line.
    'replace enabled_modules -> Vec<Box<dyn Module<G>>> with vec!\[\]',
    # The heap counter's `uncounted` is compiled only where the global
    # counter isn't (a release build, or `--cfg shuyi_no_heap_count`), and
    # mutants test a debug build: no test there compiles it (and nothing
    # calls it). Its twin, `counted`, is caught.
    'replace uncounted -> Counts',
    # The same for its rows: `uncounted_rows` is compiled only where the
    # global counter isn't. Its twin, `counted_rows`, is caught.
    'replace uncounted_rows -> Vec<TagCounts>',
    # The tags' table has two `with_names`, by build: with `std` (behind a
    # `Mutex`), whose only mutant (`Default::default()` for any `R`)
    # doesn't build, and without `std`, which mutants (a `std` build) never
    # compile.
    'tags\.rs:\d+:\d+: replace with_names -> R',
]
