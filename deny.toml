# Supply-chain policy for cargo-deny.
#
# The [licenses] allow list is the permissive list of ADR-0002 §8 (the
# game's ADR-0013, inherited): no copyleft, nothing non-commercial,
# nothing that costs money. Never add a denied license here. An unknown or
# custom license needs a [[licenses.clarify]] or [licenses.exceptions]
# entry with a comment saying why it is safe to ship commercially, in the
# PR that adds it.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Every RUSTSEC advisory is denied unless it is ignored here with a
# reason. Known advisories in macroquad's own dependency tree, with no
# fixed version upstream; revisit whenever upgrading macroquad.
ignore = [
    { id = "RUSTSEC-2025-0035", reason = "macroquad soundness issues (mutable statics); no fix upstream, no safe alternative chosen yet; revisit on macroquad upgrade" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser (via fontdue via macroquad) is unmaintained; no fix upstream; revisit on macroquad upgrade" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "OFL-1.1", # only used if a font crate needs it
]
confidence-threshold = 0.9
exceptions = []

# The engine's own crates are checked too: they are MIT OR Apache-2.0.
[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's crates depend on each other by path with no version
# requirement, which cargo-deny otherwise flags as a wildcard.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
