[package]
name = "shuyi-app"
description = "Shuyi Engine's macroquad backend: the window, blitting, keyboard and controllers, the audio player and storage behind shuyi-platform's Platform, and the loop that drives its App on desktop and the web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# The workspace lints (`[workspace.lints]` in the root Cargo.toml), copied
# because one differs and Cargo can't override a single inherited lint:
# `unsafe_code` is `deny` here instead of `forbid`, so the web build's
# controller plugin can declare the JS functions it imports
# (`src/pads/web.rs`, the only `#[allow(unsafe_code)]`; game ADR-0034, and
# game ADR-0004 rule 5: no `unsafe` outside the platform). A test in `lib.rs`
# keeps the rest equal to the workspace's.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[features]
# `link`: the live link's listener (ADR-0047), so `shuyi attach` reaches the
# running game: with debug tools compiled in and `SHUYI_LINK=<port>` set,
# the game listens on 127.0.0.1. On the web it builds and does nothing
# (ticket 2522). Off by default; `shuyi export` never turns it on.
link = ["shuyi-platform/link", "dep:image", "dep:getrandom"]
# `capture`: the capture mode (ADR-0052, ticket 2018). With
# `SHUYI_CAPTURE=<plan>` set, the game runs as the plan says, its window's
# pixels are compared with the raster's, and the process exits. On the web
# it runs `capture.ron` beside the page and logs each capture to the
# browser's console (ticket 2019). Off by default; never in a shipped
# build.
capture = ["shuyi-platform/capture", "shuyi-ui/raster", "dep:image"]

[dependencies]
shuyi-assets = { path = "../assets" }
shuyi-ui = { path = "../ui" }
# The platform boundary this crate implements, and the `App` it drives;
# `heap` for its heap snapshots, the counter's rows as `heap::snapshot`
# reads them.
shuyi-platform = { path = "../platform", features = ["heap"] }
# The heap counter of every debug build (ADR-0046 §9): its `global` feature
# is the one `#[global_allocator]`, shared with `shuyi-cli`'s.
shuyi-alloc-count = { path = "../alloc-count", features = ["global"] }
macroquad.workspace = true
# Sound effects play on a quad-snd context of the player's own, where each
# playback stops alone (ticket 2344), and native music decodes on a worker
# thread into contexts of its own (ticket 0215, game ADR-0028). The same
# version macroquad's `audio` feature uses, on every target.
quad-snd = "0.2.8"
# The link's picture of the window as a PNG, and the capture mode's: the
# version macroquad already uses, PNG only (the `link` and `capture`
# features). On every target: the render card's example encodes its
# pictures with it on the web too (ticket 2019).
image = { version = "0.24", default-features = false, features = ["png"], optional = true }

# Storage on the web (ticket 0207): `localStorage`. Native resolves its
# data directory by hand (see storage/native.rs) rather than pulling in the
# `directories` crate, which drags in MPL-2.0 (denied by game ADR-0013).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Controllers on Windows, Linux and macOS (ticket 0219, game ADR-0034). The web
# build reads the browser's Gamepad API through `crates/cli/web/gamepad.js` instead.
gilrs = "0.11.2"
# The trace file `SHUYI_PERF` names: each frame's record as a JSON line
# (ADR-0046).
serde_json = "1"
# The link's token: 128 bits from the system (the `link` feature; on the
# web it would need `wasm-bindgen`).
getrandom = { version = "0.4", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
quad-storage = "0.1"

[dev-dependencies]
# The link's listener and the capture mode, for clippy and the tests.
shuyi-app = { path = ".", features = ["link", "capture"] }
# Turns on `storage::conformance_suite` in tests, and the toy game the
# link's tests attach to.
shuyi-ui = { path = "../ui", features = ["storage-conformance", "toy"] }
# A voice variant for the voice player's tests.
serde.workspace = true

# The tests run on native alone. These two would pull `getrandom` into the
# render card's web build (an example builds with the dev-dependencies),
# and on the web it needs `wasm-bindgen`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
# Variant picking property test (audio.rs, ticket 0212).
proptest.workspace = true

[[example]]
# The render card (ticket 2392, ADR-0052 §6): every kind of thing a frame
# draws, in the window and compared with the raster. CI's `render` job
# runs it under Xvfb, and `web-render` in headless Chromium (ticket 2019).
name = "render_card"
required-features = ["capture"]
