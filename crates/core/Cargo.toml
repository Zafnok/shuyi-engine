[package]
name = "shuyi-core"
description = "Shuyi Engine's core: the seeded RNG, the simulation traits and the tactics kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# `std` is on by default; without it the crate builds with `no_std` +
# `alloc` (for the Playdate, game ADR-0070 §3).
[features]
default = ["std"]
std = ["serde/std"]
# JSON schemas of the playtest report and its checks, for the tool
# contract (`shuyi-cli`).
schema = ["dep:schemars"]

[dependencies]
serde.workspace = true
schemars = { version = "1", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
proptest.workspace = true
ron = { workspace = true, features = ["std"] }
