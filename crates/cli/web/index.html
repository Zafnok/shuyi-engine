<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%TITLE%</title>
<link rel="license" href="NOTICES.txt">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<script>
  // The bundle is strict-mode JS and its last plugin (`quad_net`, unused)
  // assigns to an undeclared global `register_plugin`, which throws an
  // uncaught ReferenceError. Declaring the global first lets it succeed
  // (ticket 0225). Keep this before `mq_js_bundle.js`.
  var register_plugin;
</script>
<script>
  // Browsers keep audio off until a key press or click counts as the
  // player's gesture (Escape and modifier keys don't). The bundle's own
  // unlock gives up after the first key either way, so the music could
  // stay silent for good (ticket 0224). Track every AudioContext the bundle
  // makes and resume it on each key press, click or touch until it runs.
  (function () {
    const Base = window.AudioContext || window.webkitAudioContext;
    if (!Base) return;
    const contexts = [];
    class TrackedAudioContext extends Base {
      constructor(...args) {
        super(...args);
        contexts.push(this);
      }
    }
    window.AudioContext = TrackedAudioContext;
    window.webkitAudioContext = TrackedAudioContext;
    const resume = () => {
      for (const context of contexts) {
        if (context.state === "suspended") context.resume();
      }
    };
    for (const type of ["keydown", "mousedown", "touchend"]) {
      document.addEventListener(type, resume, true);
    }
  })();
</script>
<script src="mq_js_bundle.js"></script>
<!-- Storage (0207): register the localStorage plugin before it's needed. -->
<script src="sapp_jsutils.js"></script>
<script src="quad-storage.js"></script>
<!-- Controllers (0219): our own plugin over the browser's Gamepad API. -->
<script src="gamepad.js"></script>
<script>
  // Note: `mq_js_bundle.js` already declares a top-level `canvas` (and runs
  // in strict mode), so re-declaring it here — even as a plain `var` — would
  // throw and skip this whole script block. Use a different name.
  const glcanvas = document.getElementById("glcanvas");
  glcanvas.focus();
  glcanvas.addEventListener("click", () => glcanvas.focus());
  // mq_js_bundle.js's own key handler prevents default for the keys sokol
  // reports as arrows/space/tab; this listener is a backstop for anything it
  // doesn't cover (e.g. Firefox's Escape/PageUp/PageDown scroll behaviour).
  window.addEventListener("keydown", (event) => {
    const keys = [
      "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
      " ", "Tab", "PageUp", "PageDown", "Home", "End",
    ];
    if (keys.includes(event.key)) {
      event.preventDefault();
    }
  }, false);
  load("%WASM%");
</script>
</body>
</html>
