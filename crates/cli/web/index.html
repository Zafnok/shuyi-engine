<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%TITLE%</title>
<link rel="license" href="NOTICES.txt">
<!-- The game's .wasm, fetched from the start, beside its pack (3318): the
     game's `load` below takes this fetch over once the pack's index has
     arrived. `crossorigin` makes it the fetch `load` makes. -->
<link rel="preload" href="%WASM%" as="fetch" crossorigin>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<script>
  // The bundle is strict-mode JS and its last plugin (`quad_net`, unused)
  // assigns to an undeclared global `register_plugin`, which throws an
  // uncaught ReferenceError. Declaring the global first lets it succeed
  // (ticket 0225). Keep this before `mq_js_bundle.js`.
  var register_plugin;
</script>
<script>
  // Browsers keep audio off until a key press or click counts as the
  // player's gesture (Escape and modifier keys don't). The bundle's own
  // unlock gives up after the first key either way, so the music could
  // stay silent for good (ticket 0224). Track every AudioContext the bundle
  // makes and resume it on each key press, click or touch until it runs.
  (function () {
    const Base = window.AudioContext || window.webkitAudioContext;
    if (!Base) return;
    const contexts = [];
    class TrackedAudioContext extends Base {
      constructor(...args) {
        super(...args);
        contexts.push(this);
      }
    }
    window.AudioContext = TrackedAudioContext;
    window.webkitAudioContext = TrackedAudioContext;
    const resume = () => {
      for (const context of contexts) {
        if (context.state === "suspended") context.resume();
      }
    };
    for (const type of ["keydown", "mousedown", "touchend"]) {
      document.addEventListener(type, resume, true);
    }
  })();
</script>
<script src="mq_js_bundle.js"></script>
<!-- The JS objects some of our plugins hand strings and bytes across with. -->
<script src="sapp_jsutils.js"></script>
<!-- Saves (3033): our own plugin over the browser's localStorage. -->
<script src="storage.js"></script>
<!-- Controllers (0219): our own plugin over the browser's Gamepad API. -->
<script src="gamepad.js"></script>
<!-- Sound output (3031): our own plugin over Web Audio, for the in-house sound. -->
<script src="sound.js"></script>
<!-- Files the player keeps (3309): a download, and the browser's file picker
     for a file the game asks for; our own plugin, after sapp_jsutils.js. -->
<script src="player-files.js"></script>
<!-- Files from the page (3069): its sessionStorage's files laid over the
     game's, and its problems sent back; our own plugin, after sapp_jsutils.js. -->
<script src="page-files.js"></script>
<!-- The pack beside the page (3300, 3318): a release export's files, baked,
     streamed in the order the bake laid them, the game started once their
     index has arrived; our own plugin, after sapp_jsutils.js. -->
<script src="pack-file.js"></script>
<script>
  // Note: `mq_js_bundle.js` already declares a top-level `canvas` (and runs
  // in strict mode), so re-declaring it here — even as a plain `var` — would
  // throw and skip this whole script block. Use a different name.
  const glcanvas = document.getElementById("glcanvas");
  // The keys go to the frame that has focus. A site that frames the game
  // (itch.io) keeps it on its own page: after its Run button, when it shows
  // the frame only once the game has loaded, and after its Fullscreen
  // button, which fullscreens the frame from outside. So the page takes
  // focus at load, when its frame is first shown, and when it comes to
  // fill the screen; never on any other resize, so it doesn't take it from
  // a text box on the site (ticket 3505). The bundle reads the keys on the
  // canvas, so whenever the page has focus the canvas takes it too (a frame
  // shown late can get focus before its canvas has a box to take it).
  let shuyi_had_focus = false;
  window.addEventListener("focus", () => {
    shuyi_had_focus = true;
    if (document.activeElement !== glcanvas) glcanvas.focus();
  });
  const shuyi_take_focus = () => {
    window.focus();
    glcanvas.focus();
    if (document.hasFocus()) shuyi_had_focus = true;
  };
  shuyi_take_focus();
  window.addEventListener("load", shuyi_take_focus);
  window.addEventListener("resize", () => {
    const fills_screen = window.innerWidth >= screen.width - 1
      && window.innerHeight >= screen.height - 1;
    if (document.hasFocus()) {
      if (document.activeElement !== glcanvas) glcanvas.focus();
    } else if (fills_screen || !shuyi_had_focus) {
      // After the resize, once the canvas is laid out at its new size.
      requestAnimationFrame(shuyi_take_focus);
    }
  });
  glcanvas.addEventListener("click", () => glcanvas.focus());
  // mq_js_bundle.js's own key handler prevents default for the keys sokol
  // reports as arrows/space/tab; this listener is a backstop for anything it
  // doesn't cover (e.g. Firefox's Escape/PageUp/PageDown scroll behaviour).
  window.addEventListener("keydown", (event) => {
    const keys = [
      "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
      " ", "Tab", "PageUp", "PageDown", "Home", "End",
    ];
    if (keys.includes(event.key)) {
      event.preventDefault();
    }
  }, false);
  // A release export names its pack (`%PACK%`), and the game starts once
  // the pack's index has arrived, its .wasm fetched meanwhile (the preload
  // above); a build that embeds its files names none, and the game starts
  // at once.
  shuyi_fetch_pack("%PACK%", function () { load("%WASM%"); });
</script>
</body>
</html>
