[package]
name = "shuyi-cli"
description = "Shuyi Engine's tools: the tool contract (new, check, run, scene, replay, bots, import, doctor, with JSON), and frame-png, font-atlas, check-keys, check-text, check-skills, lang-status, web and private-assets, run on a project its shuyi.ron describes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "shuyi"
path = "src/main.rs"

[[example]]
# The toy game's tool program: `frame-png` and `lang-status` on the toy
# (`toy/shuyi.ron`).
name = "toy"
required-features = ["toy"]

[features]
# `toy`: the toy game's tools (`shuyi_cli::toy`), for this crate's tests and
# its `toy` example.
toy = ["shuyi-ui/toy"]
# `jis`: `font-atlas` reads a BDF font in JIS X 0208 (a Japanese bitmap
# font's codes) as Unicode. Off by default: a game whose font is in Unicode
# doesn't build the table.
jis = ["dep:encoding_rs"]
# `corners`: the `corners` command, a terrain's corner sheet made from its
# recipe, and `corners::check`, which a game's test keeps it equal with
# (ticket 2259, ADR-0160). Off by default: a game that doesn't make its
# corner pictures builds none of it.
corners = ["shuyi-assets/corners"]

[dependencies]
# The state hash `replay` compares, and the turn rules it re-runs.
shuyi-core = { workspace = true, features = ["default", "schema"] }
# Fonts, images, palettes, languages and credits; with `png`, the
# pictures a one-bit bake dithers, and the sources its contact sheet draws;
# with `sfx`, sound effects, so a game's tools read and bake them whether
# or not the game turns it on (ticket 2225).
shuyi-assets = { workspace = true, features = ["default", "png", "sfx"] }
# The frame `frame-png` paints (with the raster that paints it), and the
# perf records `run --perf` reads (with their schemas).
shuyi-ui = { workspace = true, features = ["default", "schema", "raster"] }
# The Harness that plays a game's script, and the live link `attach` speaks;
# `heap` for the sessions' heap snapshots (`heap::snapshot`).
shuyi-platform = { workspace = true, features = ["default", "harness", "link", "heap", "schema"] }
# The heap counter of the tool program's debug build (ADR-0046 §9), which
# `run --perf` and MCP's sessions read: its `global` feature is the one
# `#[global_allocator]`, shared with `shuyi-app`'s.
shuyi-alloc-count = { workspace = true, features = ["default", "global"] }
serde = { workspace = true, features = ["std"] }
# The project file, `shuyi.ron`, and the font atlas's `atlas.ron`.
ron = { workspace = true, features = ["std"] }
png = "0.18"
# `frame-png --gif`: frames over time as a GIF, written with an exact
# palette. Without the default `color_quant`: we never quantize.
gif = { version = "0.14", default-features = false, features = ["std"] }
# The contract's answers as JSON (`--json`), and their JSON schemas.
serde_json = "1"
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
# `new`'s template (`templates/shuyi-default` at the repository's root),
# the skill pack it copies into a game (`skills/`) and the engine's target
# profiles (`targets/`), embedded: `build.rs` writes their tables, and
# `shuyi_embed::files!` includes them.
shuyi-embed = { workspace = true }
# `add`: a game's `Cargo.toml` edited keeping its layout, and the
# modules' metadata (`[package.metadata.shuyi]`) read from theirs.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display", "serde"] }
# A template's `engine` (`>=0.1, <0.2`), matched against this engine's
# version.
semver = { version = "1", default-features = false, features = ["std", "serde"] }
# A skill's frontmatter (`SKILL.md`'s YAML), for `check-skills`.
serde_norway = "0.9"
# `export`'s archives: deflate and gzip for its zips and `tar.gz`
# (miniz_oxide, in Rust), and the zip's CRC-32.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = { version = "1", default-features = false, features = ["std"] }
# `reveal commit`: each commitment's salt, from the system's random source.
getrandom = { version = "0.4", default-features = false }
# `export playdate`: a game's OGG and WAV files read at build time, to bake
# them to ADPCM. Readers, on the developer's machine (`tools/layers.ron`).
lewton = "0.9"
hound = "3.5"
# `new`'s prompts in a terminal (ticket 3423): a line of text, a list to
# pick one answer from, a list to tick any of. Without the defaults
# `editor` (tempfile) and `password` (zeroize): only `Input`, `Select` and
# `MultiSelect` are used. MIT; on `console`, already here.
dialoguer = { version = "0.12", default-features = false }
# `font-atlas`, with `jis`: a Japanese BDF font's JIS X 0208 code points
# read as Unicode, through the EUC-JP decoder's table.
encoding_rs = { version = "0.8.35", default-features = false, features = ["alloc"], optional = true }
# `crash --symbols`: a crash report's frames named from the debug file of
# its build (DWARF in a PE or ELF file, ticket 3441). `loader` reads the
# file (with `object`, `memmap2` and `typed-arena`); `rustc-demangle`
# writes Rust's names as people read them. Without the default
# `cpp_demangle` and `smallvec`. The developer's tools only: nothing of it
# reaches a game.
addr2line = { version = "0.27", default-features = false, features = ["loader", "rustc-demangle"] }

[build-dependencies]
shuyi-embed = { workspace = true }

[dev-dependencies]
# The toy game's tools for the integration tests in tests/.
shuyi-cli = { path = ".", features = ["toy", "jis", "corners"] }
# Ticket 2203's formats, so the tests paint them (ticket 2234). A game
# turns on those it uses in its own `Cargo.toml`; this crate has no
# feature of its own for them.
shuyi-assets = { path = "../assets", features = ["png", "jpeg", "webp", "qoi", "jpeg-xl", "flac", "mp3", "sfx"] }
# The template loader and the composer, fed any input.
proptest.workspace = true
# The toy's perf summary and trace, as committed snapshots.
insta.workspace = true

# `crash --symbols`'s tests (ticket 3441), where test builds carry DWARF:
# `object` finds a function of the test program in its symbol table, and
# `backtrace` takes a frame of its stack as the crash hook takes one, with
# its module's base on Windows. The `object` version is `addr2line`'s.
[target.'cfg(any(target_os = "linux", all(windows, target_env = "gnu")))'.dev-dependencies]
object = { version = "0.40", default-features = false, features = ["read"] }
backtrace = "0.3.77"
