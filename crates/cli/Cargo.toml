[package]
name = "shuyi-cli"
description = "Shuyi Engine's tools: the tool contract (new, check, run, scene, replay, bots, import, doctor, with JSON), and frame-png, font-atlas, check-keys, check-text, check-skills, lang-status, web and private-assets, run on a project its shuyi.ron describes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "shuyi"
path = "src/main.rs"

[[example]]
# The toy game's tool program: `frame-png` and `lang-status` on the toy
# (`toy/shuyi.ron`).
name = "toy"
required-features = ["toy"]

[features]
# `toy`: the toy game's tools (`shuyi_cli::toy`), for this crate's tests and
# its `toy` example.
toy = ["shuyi-ui/toy"]

[dependencies]
# The state hash `replay` compares, and the turn rules it re-runs.
shuyi-core = { path = "../core", features = ["schema"] }
# Fonts, images, palettes, languages and credits; with `png`, the
# pictures a one-bit bake dithers, and the sources its contact sheet draws.
shuyi-assets = { path = "../assets", features = ["png"] }
# The frame `frame-png` paints (with the raster that paints it), and the
# perf records `run --perf` reads (with their schemas).
shuyi-ui = { path = "../ui", features = ["schema", "raster"] }
# The Harness that plays a game's script, and the live link `attach` speaks;
# `heap` for the sessions' heap snapshots (`heap::snapshot`).
shuyi-platform = { path = "../platform", features = ["harness", "link", "heap"] }
# The heap counter of the tool program's debug build (ADR-0046 §9), which
# `run --perf` and MCP's sessions read: its `global` feature is the one
# `#[global_allocator]`, shared with `shuyi-app`'s.
shuyi-alloc-count = { path = "../alloc-count", features = ["global"] }
serde = { workspace = true, features = ["std"] }
# The project file, `shuyi.ron`, and the font atlas's `atlas.ron`.
ron = { workspace = true, features = ["std"] }
png = "0.18"
# The contract's answers as JSON (`--json`), and their JSON schemas.
serde_json = "1"
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
# `new`'s template (`templates/shuyi-default` at the repository's root),
# and the skill pack it copies into a game (`skills/`), embedded.
include_dir.workspace = true
# `add`: a game's `Cargo.toml` edited keeping its layout, and the
# modules' metadata (`[package.metadata.shuyi]`) read from theirs.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display", "serde"] }
# A template's `engine` (`>=0.1, <0.2`), matched against this engine's
# version.
semver = { version = "1", default-features = false, features = ["std", "serde"] }
# A skill's frontmatter (`SKILL.md`'s YAML), for `check-skills`.
serde_norway = "0.9"
# `export`'s archives: deflate and gzip for its zips and `tar.gz`
# (miniz_oxide, in Rust), and the zip's CRC-32.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
# The toy game's tools for the integration tests in tests/.
shuyi-cli = { path = ".", features = ["toy"] }
# The template loader and the composer, fed any input.
proptest.workspace = true
# The toy's perf summary and trace, as committed snapshots.
insta.workspace = true
