[package]
name = "shuyi"
description = "Shuyi Engine's front door: the default engine's crates under short names, the prelude a game names, and one cargo feature per module, each off by default"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# One feature per module, off by default, named for its crate without
# `shuyi-` (`physics` for `shuyi-physics`), and a row in docs/modules.md.
# A module's ticket adds its feature, its optional dependency and, when it
# joins the frame loop, its line in `enabled_modules` (ADR-0009 §6). `cargo xtask
# check-modules` fails on a feature with no catalog row. `std` and `app` are
# the default engine's, no modules: a game on a device with neither, such as
# the Playdate, turns the default features off (ADR-0062).
[features]
default = ["std", "app", "system-languages"]
std = ["shuyi-core/std", "shuyi-assets/std", "shuyi-ui/std", "shuyi-platform/std"]
app = ["std", "dep:shuyi-app"]
# `system-languages`: the macroquad backend reads the system's preferred
# languages on a desktop (`sys-locale`, ticket 2349), so a new player starts
# in the system's language when the game has it. On by default; a game
# turns it off with `default-features = false` and `features = ["std",
# "app"]`, and then starts in its source language until the player picks.
system-languages = ["app", "shuyi-app?/system-languages"]
# `schema`: the engine's types describe their shapes with `schemars`
# (ADR-0084 §2), for a game's tools: a game's `tools` feature turns it on,
# and a shipped game builds no schema.
schema = ["shuyi-core/schema", "shuyi-ui/schema", "shuyi-platform/schema"]
# `shuyi-script` (ADR-0093): rules from scripts, a library the rules call,
# so no `Module`. It needs `std`.
script = ["std", "dep:shuyi-script"]
# `shuyi-net` (ADR-0154): the transport a game's online play talks
# through, and an in-memory network for its tests; a library, so no
# `Module`. It needs `std`.
net = ["std", "dep:shuyi-net"]

[dependencies]
shuyi-core = { workspace = true }
shuyi-assets = { workspace = true }
shuyi-ui = { workspace = true }
shuyi-platform = { workspace = true }
shuyi-script = { workspace = true, optional = true }
shuyi-net = { workspace = true, optional = true }

# The macroquad backend, on every target with a window. WASI has none, and
# macroquad's web callbacks there are imports nothing provides: a game's
# library tests build for it without the backend (CI's `determinism` job,
# ticket 2116).
[target.'cfg(not(target_os = "wasi"))'.dependencies]
shuyi-app = { workspace = true, optional = true }

[dev-dependencies]
# The toy game, to install every module on.
shuyi-ui = { path = "../ui", features = ["toy"] }
