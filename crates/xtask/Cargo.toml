[package]
name = "xtask"
description = "Shuyi Engine's repository tooling (`cargo xtask`): the ticket lint, the link check and the `no_std` path check; never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Ticket frontmatter (the game's lint reads it the same way).
serde_norway = "0.9"
# Markdown links, without the HTML renderer or the binary's options.
pulldown-cmark = { version = "0.13", default-features = false }
