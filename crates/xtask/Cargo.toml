[package]
name = "xtask"
description = "Shuyi Engine's repository tooling (`cargo xtask`): the ticket lint, the link check, the docs map check, the `no_std` path check, the layers check and the pinned Rust check; never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Ticket frontmatter (the game's lint reads it the same way).
serde_norway = "0.9"
# Markdown links, without the HTML renderer or the binary's options.
pulldown-cmark = { version = "0.13", default-features = false }
# `check-layers`: `tools/layers.ron` and `cargo metadata`'s JSON.
serde.workspace = true
serde_json = "1"
ron = { workspace = true, features = ["std"] }
