[package]
name = "shuyi-platform"
description = "Shuyi Engine's platform boundary: the Platform trait every backend implements, App, which runs one frame of a game for the backend's own loop, the headless backend, and the test Harness over it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# No window, sound card, file or clock here (ADR-0008 §2): only backends
# touch devices. `cargo xtask check-layers` (CI's `layers` job) keeps
# macroquad, gilrs and every audio crate out of this crate's dependencies.
[features]
default = ["std"]
# Without it the crate is `no_std` + `alloc`, for the Playdate (ADR-0008 §5;
# CI's `no-std` job builds it so, ticket 3005).
std = ["shuyi-core/std", "shuyi-assets/std", "shuyi-ui/std", "serde/std", "ron/std", "shuyi-alloc-count?/std"]
# `harness`: the headless test driver for a game's integration tests
# (game ADR-0017).
harness = []
# `link`: the live link's wire and its server (ADR-0047), which a backend's
# listener runs in a debug build. It reads and writes JSON lines, so it
# needs `std`.
link = ["std", "dep:serde_json"]
# `heap`: `heap::snapshot`, the one conversion of the heap counter's rows
# into a `HeapSnapshot`, which `shuyi-app` and `shuyi-cli` share. It needs
# the counter's types, not its global static (`global`).
heap = ["dep:shuyi-alloc-count"]
# `capture`: plans, which a backend's capture mode plays and whose frames
# it compares with the raster (ADR-0052, ticket 2018). `no_std`: CI's
# `no-std` job builds it so.
capture = ["shuyi-ui/raster"]

[dependencies]
# The step rate, which `tick` re-exports; the frame's hash and the build's
# stamp in a session record.
shuyi-core = { path = "../core", default-features = false }
# The font atlas, the image table and the voice clips' file names.
shuyi-assets = { path = "../assets", default-features = false }
# The game's frame loop (`Game`), its context and storage.
shuyi-ui = { path = "../ui", default-features = false }
# A session record's file and what the frame's hash reads; the live link's
# requests and answers (the `link` feature) and a plan's file (the `capture`
# feature) use them too.
serde.workspace = true
ron.workspace = true
# The live link's requests and answers as JSON lines (the `link` feature).
serde_json = { version = "1", optional = true }
# The heap counter's counts and rows (the `heap` feature), never its
# global static.
shuyi-alloc-count = { path = "../alloc-count", default-features = false, optional = true }

[dev-dependencies]
# The Harness and the toy game for the tests.
shuyi-platform = { path = ".", default-features = false, features = ["harness", "link", "heap", "capture"] }
shuyi-ui = { path = "../ui", default-features = false, features = ["toy"] }
# The link's server and the Harness playing random scripts alike, and
# random plans.
proptest.workspace = true
