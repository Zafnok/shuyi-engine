[package]
name = "shuyi-playdate"
description = "Shuyi Engine's Playdate backend: the update callback, the d-pad, A, B and the crank, the 1-bit display with changed rows, storage on the SDK's files, and sound on its sample and file players, behind shuyi-platform's Platform, for a game built by shuyi export playdate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# The workspace lints (`[workspace.lints]` in the root Cargo.toml), copied
# because one differs and Cargo can't override a single inherited lint:
# `unsafe_code` is `deny` here instead of `forbid`, because a backend holds
# the FFI, the allocator and the panic handler. Only `src/device/` allows
# it. A test in `lib.rs` keeps the rest equal to the workspace's.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[dependencies]
# `no_std`: the Playdate has no standard library (ADR-0008 §2).
shuyi-assets = { path = "../assets", default-features = false }
# `storage-conformance`: a debug build checks its storage on the device's real
# files at start (`storage::check`).
shuyi-ui = { path = "../ui", default-features = false, features = ["storage-conformance"] }
shuyi-platform = { path = "../platform", default-features = false }
# The debug build's heap counter around the SDK's allocator (`src/device/`).
shuyi-alloc-count = { path = "../alloc-count", default-features = false }

[dev-dependencies]
# The toy game the backend's tests run.
shuyi-ui = { path = "../ui", default-features = false, features = ["toy"] }
