[package]
name = "shuyi-alloc-count"
description = "Shuyi Engine's heap counter: CountingAlloc, a global allocator around another that counts live bytes, their peak and the calls, in total and by memory tag, and the one counting allocator every debug build of a game on shuyi-app and of its tool program runs on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# The workspace lints (`[workspace.lints]` in the root Cargo.toml), copied
# because one differs and Cargo can't override a single inherited lint:
# `unsafe_code` is `deny` here instead of `forbid`, because `GlobalAlloc`
# is an unsafe trait (ADR-0046 §9; ADR-0002 §9). `src/counter.rs` is the
# only `#[allow(unsafe_code)]`, and a test in `lib.rs` keeps the rest equal
# to the workspace's.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[features]
default = ["std"]
# Without it the crate is `no_std`: a console's backend wraps its own
# allocator (the Playdate SDK's `realloc`).
std = []
# `global`: the one `#[global_allocator]`, a `CountingAlloc<System>`, in a
# debug build without `--cfg shuyi_no_heap_count`, and `global::reading`.
# `shuyi-app` and `shuyi-cli` both turn it on.
global = ["std"]

[dev-dependencies]
# The global counter, for its tests (a dev-dependency on itself, as
# `shuyi-app`'s for its `link`).
shuyi-alloc-count = { path = ".", features = ["global"] }
proptest.workspace = true
