[package]
name = "shuyi-net"
description = "Shuyi Engine's networking, pure: the Transport trait a game's online play talks through, and an in-memory network with seeded faults for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# What it answers (ADR-0009 §4), read by the catalog, `shuyi modules` and
# `shuyi add`.
[package.metadata.shuyi]
answers = [{ concern = "online", answer = "server" }]
serves = ["fixed-ticks"]

[features]
# `testing`: `room::testing::Dots`, a tiny room game for the tests of
# rooms and what is built on them (the director, a server). Off by
# default: a game builds none of it.
testing = []

[dependencies]
# The faults draw from the core's `SimRng` (without `std`, as the
# workspace names it). No outside crate: the crate is pure (ADR-0155).
shuyi-core = { workspace = true }

[dev-dependencies]
proptest.workspace = true
# `room::testing::Dots` for the integration tests in tests/ and the docs'
# examples.
shuyi-net = { path = ".", features = ["testing"] }
