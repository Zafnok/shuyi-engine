[package]
name = "shuyi-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
# Without it the crate is `no_std` + `alloc` (game ADR-0070 §6): a layer is then a
# file table (`Layer::table`), since `include_dir` needs `std`.
std = ["dep:include_dir", "ron/std", "thiserror/std", "serde/std", "shuyi-core/std"]
# `bitmap::convert::png_pixels`: a tool that makes one-bit pictures reads
# the PNGs with it (game ADR-0085). Only tools turn it on.
png = ["std", "dep:png"]
# `keymap::sample`, a sample game's actions and keymap file, for other
# engine crates' tests of input (ticket 1107).
sample-actions = []
# `golden`: golden tables, values a build gives pinned in a file beside
# the tests (ticket 2116). For tests: a crate turns it on in its
# dev-dependency on this one.
golden = []

[dependencies]
# The grid a `.map` file is read into (`grid_map`); character ids and the
# `{token}` splitter, for dialogue and languages.
shuyi-core = { path = "../core", default-features = false }
serde.workspace = true
ron.workspace = true
include_dir = { workspace = true, optional = true }
thiserror.workspace = true
# The process-wide bundle, set once, without `std`.
once_cell.workspace = true
# Float rounding without `std` (lights).
libm.workspace = true
png = { version = "0.18", optional = true }
# The pack (`pack`, ADR-0023): the binary form of a baked asset, and the
# compression of a pack's files. Both without `std`, for the Playdate;
# LZ4 in safe code, with its decoder checked so broken bytes are an error.
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
lz4_flex = { version = "0.14", default-features = false, features = ["alloc", "safe-encode", "safe-decode", "checked-decode"] }

[dev-dependencies]
proptest.workspace = true
# The pinned binary form of every engine kind (`pack`'s tests).
insta.workspace = true
# Its own tests read PNGs too (`bitmap::convert::png_pixels`), and check
# its golden tables (`golden`), whatever features the test run turns on.
shuyi-assets = { path = ".", features = ["png", "golden"] }
