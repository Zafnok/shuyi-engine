[package]
name = "shuyi-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
# Without it the crate is `no_std` + `alloc` (game ADR-0070 §6).
std = ["ron/std", "thiserror/std", "serde/std", "shuyi-core/std"]
# `bitmap::convert::png_pixels`: a tool that makes one-bit pictures reads
# the PNGs with it (game ADR-0085). Only tools turn it on.
png = ["std", "dep:png"]
# `keymap::sample`, a sample game's actions and keymap file, for other
# engine crates' tests of input (ticket 1107).
sample-actions = []
# `golden`: golden tables, values a build gives pinned in a file beside
# the tests (ticket 2116). For tests: a crate turns it on in its
# dev-dependency on this one.
golden = []
# `message::parse_count`, which counts `Message::parse` on the thread: a
# test that no frame parses a text turns it on (ticket 2266).
parse-count = ["std"]
# More picture and sound formats (ticket 2203, ADR-0007 §3), each its own
# switch so a game pays only for what it uses: `Formats::standard()`
# registers a format once its feature is on. Pictures: the pixels
# (`image::Image`) and the size (`image::ImageInfo`). Sounds: the header
# (`audio::Sound`) and a music track's header and length
# (`audio::MusicTrack`). The decoders are scalar, so a picture's pixels
# are the same on every target (ADR-0007 §5).
jpeg = ["dep:zune-jpeg"]
webp = ["std", "dep:image-webp"]
qoi = ["dep:qoi"]
jpeg-xl = ["std", "dep:jxl-oxide"]
flac = ["std", "dep:claxon"]
mp3 = ["dep:nanomp3"]
# `sfx`: sound effects written as a few numbers, `.sfx.ron` files rendered
# to a WAV in integers as the game loads them (ticket 2225, ADR-0144):
# `sfx::SfxDef`, the formats `SfxDefRon` and `SfxRon`, and ten presets.
# No dependency and no `std`. A game turns it on in its own `Cargo.toml`.
sfx = []

[dependencies]
# The grid a `.map` file is read into (`grid_map`); character ids and the
# `{token}` splitter, for dialogue and languages.
shuyi-core = { path = "../core", default-features = false }
serde.workspace = true
ron.workspace = true
# `files!`: a folder's table, written at compile time (ADR-0138).
shuyi-embed-macros = { path = "../embed-macros" }
thiserror.workspace = true
# The process-wide bundle, set once, without `std`.
once_cell.workspace = true
# Float rounding without `std` (lights).
libm.workspace = true
png = { version = "0.18", optional = true }
# The pack (`pack`, ADR-0023): the binary form of a baked asset, and the
# compression of a pack's files. Both without `std`, for the Playdate;
# LZ4 in safe code, with its decoder checked so broken bytes are an error.
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
lz4_flex = { version = "0.14", default-features = false, features = ["alloc", "safe-encode", "safe-decode", "checked-decode"] }
# The decoders of the formats above (ticket 2203), each only with its
# feature: no SIMD (`x86`, `neon`), no threads (`rayon`), no layers I and
# II of MPEG audio.
zune-jpeg = { version = "0.5", optional = true, default-features = false }
image-webp = { version = "0.2", optional = true, default-features = false }
qoi = { version = "0.4", optional = true, default-features = false, features = ["alloc"] }
jxl-oxide = { version = "0.12", optional = true, default-features = false }
claxon = { version = "0.4", optional = true, default-features = false }
nanomp3 = { version = "0.2", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest.workspace = true
# The pinned binary form of every engine kind (`pack`'s tests).
insta.workspace = true
# Its own tests read PNGs too (`bitmap::convert::png_pixels`), and check
# its golden tables (`golden`), whatever features the test run turns on.
shuyi-assets = { path = ".", features = ["png", "golden", "parse-count", "jpeg", "webp", "qoi", "jpeg-xl", "flac", "mp3", "sfx"] }
# The heap counter `tests/lang_load.rs` reads (ticket 2266).
shuyi-alloc-count = { path = "../alloc-count", features = ["global"] }
