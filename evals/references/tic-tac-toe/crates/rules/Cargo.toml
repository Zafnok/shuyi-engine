[package]
name = "tic-tac-toe-rules"
description = "Tic-tac-toe's rules: pure and deterministic, over Shuyi Engine's TurnRules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The game's code calls it `rules` whatever the game is called.
name = "rules"

[lints]
workspace = true

[features]
# `schema`: the rules' types describe their shapes, for the game's tools
# (`scene --shape`). The game crate's `tools` turns it on; the game
# itself builds without it.
schema = ["shuyi-core/schema"]

[dependencies]
# The grid's cells, the turn rules.
shuyi-core.workspace = true
serde.workspace = true
