# SonarCloud, fed by CI's `coverage` job (ticket 2007, ADR-0017).
sonar.organization=zafnok
sonar.projectKey=Zafnok_shuyi-engine
sonar.sources=crates,examples
sonar.tests=crates,examples
sonar.test.inclusions=**/tests/**,**/tests.rs,**/*_tests.rs
# The platform backend, as the coverage job leaves it out: it is what
# touches the window, the files, the audio device and the clock.
sonar.exclusions=**/target/**,crates/app/**
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippy.reportPaths=clippy.json
