[package]
name = "box-pusher"
description = "Box Pusher: a game on Shuyi Engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The game's code calls it `game` whatever the game is called.
name = "game"

[[bin]]
name = "box-pusher"
path = "src/main.rs"

[[example]]
# The game's tool program: `cargo shuyi <command>` runs it (shuyi.ron).
name = "tools"
required-features = ["tools"]

[lints]
workspace = true

[features]
# `tools`: the engine's tools for the game (`shuyi_cli::BasicTools`) and
# its Harness, for its tool program and its tests.
tools = ["dep:shuyi-cli"]
# `link`: the live link, so `cargo shuyi attach` reaches the game running
# in its window: `SHUYI_LINK=0 cargo run --features link`, in a debug
# build. Off by default.
link = ["shuyi-app/link"]

[dependencies]
# The engine: what the game names (`shuyi::prelude`), how it starts, the
# macroquad backend (the window, input devices, audio and storage) and the
# modules it turns on.
shuyi.workspace = true
shuyi-cli = { workspace = true, optional = true }
# The macroquad backend, named for its `link` feature.
shuyi-app = { workspace = true, optional = true }
# The files under `files/`, embedded.
include_dir.workspace = true
serde.workspace = true
ron.workspace = true

[package.metadata.cargo-machete]
# Named for its feature (`link`), not its code.
ignored = ["shuyi-app"]

[dev-dependencies]
# The Harness and the tools, for the tests in tests/.
"box-pusher" = { path = ".", features = ["tools"] }
