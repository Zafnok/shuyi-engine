{% extends "base.html" %}

{% block content %}
<article class="prose">
  <h1>{{ page.title }}</h1>
  {%- if page.date %}
  <p class="meta"><time datetime="{{ page.date }}">{{ page.date | date(format="%-d %B %Y") }}</time></p>
  {%- endif %}
  {{ page.content | safe }}
</article>
{% endblock content %}
