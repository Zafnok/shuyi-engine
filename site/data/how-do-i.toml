# The "how do I" table `shuyi docs` answers beside its hits (ticket 3412,
# ADR-0153): a row's `ask` lists task phrases, and `go` the one place that
# answers them. A query matches a row when it holds every word of one of
# its phrases (the common words, "a", "the", "to"…, left out).
#
# `go` is `learn/<path under site/content/>[#anchor]`, `skill/<name>` or
# `example/<path under examples/>`. The anchor is the heading's, as Zola
# makes it. A test fails a row whose place the embedded docs don't hold
# (crates/cli/src/contract/docs/tests.rs).

