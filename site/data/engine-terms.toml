# The words of other engines and what each is in Shuyi Engine (ticket
# 3413): the table of the book's appendix A, *Coming from another engine*
# (site/content/learn/book/from-another-engine.md), which its shortcode
# `engine_terms` draws, and the doc aliases the engine's items carry.
#
# A `[[term]]` is a row:
#
# - `shuyi`: Shuyi's words, inline Markdown, with the chapters that explain
#   them as links (`[6](@/learn/book/games-and-screens.md)`);
# - `paths`: the public items they name, each at a path of its own crate
#   (`shuyi_ui::screen::Screen`), as rustdoc shows it;
# - `aliases`: the words the first path's item carries as
#   `#[doc(alias = "…")]`, so rustdoc's search finds it by them: identifiers
#   only, as rustdoc refuses a space (the engines' words with spaces stay in
#   the columns);
# - `godot`, `unity`, `bevy`, `gamemaker`, `pico8`: each engine's word,
#   inline Markdown, or "—" when it has none.
#
# A row Shuyi has no counterpart for starts `shuyi` with "none yet", names
# no path, and names the open ticket that plans it (`ticket`) or says
# `planned = false`.
#
# A `[[guess]]` is a name an agent guesses from another engine that no row
# covers: `name` is a doc alias of the item at `path`.
#
# `cargo xtask api-text --check` (CI's `api` job) holds this file to the
# code: every path names a public item, every alias here is on its item,
# every `doc(alias)` of the engine's crates is here, and a row's ticket is
# open.

