[package]
name = "hello-grid"
description = "Shuyi Engine's first example: a small grid game made from engine crates alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "hello-grid"
path = "src/main.rs"
# The window's binary; the library and its tests build without it, for a
# target with no window (CI's `determinism` job, ticket 2116).
required-features = ["window"]

[[example]]
# The game's tool program: `frame-png` and `lang-status` on this project
# (`shuyi.ron`).
name = "tools"
required-features = ["tools"]

[features]
default = ["window"]
# `window`: the binary, which opens the game in macroquad's window.
# Without it the library builds for a target that has none, as the
# golden test does under WASI (`tests/golden.rs`).
window = ["dep:macroquad"]
# `tools`: the game's `frame-png` and `lang-status` (`hello_grid::tools`),
# for its tool program and its tests.
tools = ["dep:shuyi-cli"]
# `link`: the live link, so `cargo shuyi attach` reaches the game running
# in its window: `SHUYI_LINK=0 cargo run -p hello-grid --features link`,
# in a debug build. Off by default.
link = ["window", "shuyi-app/link"]
# `capture`: the capture mode (ADR-0052), which runs a plan and compares
# the window with the raster: `SHUYI_CAPTURE=examples/hello-grid/capture/frames.ron
# cargo run -p hello-grid --features capture`. Off by default; CI's
# `render` job runs it under Xvfb.
capture = ["window", "shuyi-app/capture"]

[dependencies]
# The engine, by its front door: its crates as `shuyi::core`, `shuyi::ui`
# and the rest, the macroquad backend among them, and no module.
shuyi = { path = "../../crates/shuyi" }
# The engine's tools, which turn on the Harness.
shuyi-cli = { path = "../../crates/cli", optional = true }
# The macroquad backend, already under `shuyi`, named for its `link` and
# `capture` features.
shuyi-app = { path = "../../crates/app", optional = true }
# The entry point: `#[macroquad::main]` has to be in the binary.
macroquad = { workspace = true, optional = true }
serde = { workspace = true, features = ["std"] }
ron = { workspace = true, features = ["std"] }
# The files under `files/`, embedded.
include_dir.workspace = true

[package.metadata.cargo-machete]
# Named for its features (`link`, `capture`), not its code.
ignored = ["shuyi-app"]

[dev-dependencies]
# The Harness and the tools for the tests in tests/, without the window:
# the golden test builds for WASI (ticket 2116).
hello-grid = { path = ".", default-features = false, features = ["tools"] }
insta.workspace = true
# The golden table of `tests/golden.rs`.
shuyi-assets = { path = "../../crates/assets", features = ["golden"] }
