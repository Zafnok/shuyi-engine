[package]
name = "hello-grid"
description = "Shuyi Engine's first example: a small grid game made from engine crates alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "hello-grid"
path = "src/main.rs"
# The window's binary; the library and its tests build without it, for a
# target with no window (CI's `determinism` job, ticket 2116).
required-features = ["window"]

[[bin]]
# The dialogue preview a writer is handed: the scenes of a folder's `.dlg`
# files in the game's text box, read again when one is saved
# (`hello_grid::preview`). `cargo run -p hello-grid --bin hello-grid-preview
# -- <folder>`; the folder is `files/` when none is named.
name = "hello-grid-preview"
path = "src/bin/preview.rs"
required-features = ["window"]

[[example]]
# The game's tool program: `frame-png` and `lang-status` on this project
# (`shuyi.ron`).
name = "tools"
required-features = ["tools"]

[features]
default = ["std", "window"]
# `std`: the game's files embedded, and everything else a computer has.
# Without it the library builds for a device with no standard library, and
# reads its files from a baked pack (`hello_grid::Hello::one_bit_ctx`).
std = ["shuyi/std", "dep:include_dir", "serde/std", "ron/std"]
# `window`: the binary, which opens the game in macroquad's window.
# Without it the library builds for a target that has none, as the
# golden test does under WASI (`tests/golden.rs`).
window = ["std", "shuyi/app", "dep:macroquad"]
# `tools`: the game's `frame-png` and `lang-status` (`hello_grid::tools`),
# for its tool program and its tests; the rules' types describe their
# shapes for `scene --shape` (ADR-0084 §2).
tools = ["std", "dep:shuyi-cli", "shuyi/schema", "dep:schemars"]
# `playdate`: the game on the Playdate (`hello_grid::playdate`), which
# `cargo shuyi export playdate` builds with its default features off.
playdate = ["dep:shuyi-playdate"]
# `packaged`: does nothing. `shuyi.ron`'s `export` part turns it on, so CI's
# export job builds a package with a feature on.
packaged = []
# `packed`: the game's files are read from the pack beside the program
# (`hello-grid.pack`), which `cargo shuyi export` bakes, in place of being
# embedded (`hello_grid::layer`). A release export of the desktop or the web
# turns it on; `cargo run` and `cargo shuyi run` embed the files.
packed = ["window"]
# `link`: the live link, so `cargo shuyi attach` reaches the game running
# in its window: `SHUYI_LINK=0 cargo run -p hello-grid --features link`,
# in a debug build. Off by default.
link = ["window", "shuyi-app/link"]
# `capture`: the capture mode (ADR-0052), which runs a plan and compares
# the window with the raster: `SHUYI_CAPTURE=examples/hello-grid/capture/frames.ron
# cargo run -p hello-grid --features capture`. Off by default; CI's
# `render` job runs it under Xvfb.
capture = ["window", "shuyi-app/capture"]

[dependencies]
# The engine, by its front door: its crates as `shuyi::core`, `shuyi::ui`
# and the rest, the macroquad backend among them, and no module.
shuyi = { path = "../../crates/shuyi", default-features = false }
# The Playdate backend (the `playdate` feature).
shuyi-playdate = { path = "../../crates/playdate", optional = true }
# The engine's tools, which turn on the Harness.
shuyi-cli = { path = "../../crates/cli", optional = true }
# The macroquad backend, already under `shuyi`, named for its `link` and
# `capture` features.
shuyi-app = { path = "../../crates/app", optional = true }
# The entry point: `#[macroquad::main]` has to be in the binary.
macroquad = { workspace = true, optional = true }
serde.workspace = true
ron.workspace = true
# The shapes of the rules' types, for the tools (the `tools` feature).
schemars = { workspace = true, optional = true }
# The files under `files/`, embedded.
include_dir = { workspace = true, optional = true }

[package.metadata.cargo-machete]
# Named for its features (`link`, `capture`), not its code.
ignored = ["shuyi-app"]

[dev-dependencies]
# The Harness and the tools for the tests in tests/, without the window:
# the golden test builds for WASI (ticket 2116).
hello-grid = { path = ".", default-features = false, features = ["tools"] }
insta.workspace = true
# The golden table of `tests/golden.rs`.
shuyi-assets = { path = "../../crates/assets", features = ["golden"] }
