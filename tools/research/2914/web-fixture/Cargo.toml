[package]
name = "cold-rules-web-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The workspace lints, copied because Rust 2024 treats the five fixed Wasm
# export names as unsafe attributes. `unsafe_code` is deny instead of forbid
# so only those exports can allow it, as in shuyi-app's browser plugin.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[lib]
name = "cold_rules_web_fixture"
crate-type = ["cdylib", "rlib"]

[features]
layout-kernel = ["cloning-fixture/layout-kernel"]
vm-kernel = ["cloning-fixture/vm-kernel"]

[dependencies]
cloning-fixture = { path = "../../2912/fixture" }
serde = { workspace = true, features = ["std"] }
serde_json = "1"
shuyi-core = { path = "../../../../crates/core" }
