<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A console error</title>
</head>
<body>
<!-- check.py's fixture: a canvas of two colours, and a console error,
     which must fail `boot`. -->
<canvas id="glcanvas" width="64" height="64"></canvas>
<script>
  const context = document.getElementById("glcanvas").getContext("2d");
  context.fillStyle = "#204060";
  context.fillRect(0, 0, 64, 64);
  context.fillStyle = "#e0c080";
  context.fillRect(16, 16, 32, 32);
  console.error("fixture: a console error");
</script>
</body>
</html>
