name: Set up Zola
description: >-
  Installs the website's Zola in /usr/local/bin: 0.21.0, the last release under MIT
  (later ones are EUPL-1.2, which ADR-0002 §8 denies), downloaded from its
  GitHub release and checked against the SHA-256 below (ADR-0048). The one
  place the version is written: ci.yml and pages.yml use this action.

runs:
  using: composite
  steps:
    - name: Download Zola and check its SHA-256
      shell: bash
      env:
        ZOLA_VERSION: v0.21.0
        # zola-v0.21.0-x86_64-unknown-linux-gnu.tar.gz, as the release lists it.
        ZOLA_SHA256: 5c37a8f706567d6cad3f0dbc0eaebe3b9591cc301bd67089e5ddc0d0401732d6
      run: |
        archive="zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
        dir="$RUNNER_TEMP/zola"
        mkdir -p "$dir"
        curl --proto '=https' --tlsv1.2 -fsSL -o "$dir/$archive" \
          "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/${archive}"
        echo "${ZOLA_SHA256}  $dir/$archive" | sha256sum --check --strict
        tar -xzf "$dir/$archive" -C "$dir"
        sudo install -m 0755 "$dir/zola" /usr/local/bin/zola
        rm -rf "$dir"
        zola --version
