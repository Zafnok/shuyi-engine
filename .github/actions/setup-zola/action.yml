name: Set up Zola
description: >-
  Installs the website's Zola in /usr/local/bin with scripts/setup-zola.sh,
  which holds its version and SHA-256 (ADR-0048), the one place they are
  written: ci.yml and pages.yml use this action, and the book's dev
  container runs the script (ticket 2840).

runs:
  using: composite
  steps:
    - name: Download Zola and check its SHA-256
      shell: bash
      run: bash "$GITHUB_WORKSPACE/scripts/setup-zola.sh"
