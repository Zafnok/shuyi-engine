# Findings wrong for this repository (AGENTS.md rule 6), each with why.
rules:
  unpinned-uses:
    ignore:
      # The grid template's call of the engine's playtest workflow (ticket
      # 2021) is at `@{{engine_ref}}`, a placeholder: `shuyi new` puts the
      # game's engine commit there (or `main` when the game follows main).
      - playtest.yml:35
  dangerous-triggers:
    ignore:
      # The flaky gates' re-run (ticket 2064) must run after a CI run ends, as
      # a run can't re-run itself. It checks out main's code, never the run's,
      # runs nothing of it, and reads its logs and matrix.json as data; its
      # token may only re-run that run (`actions: write`, `contents: read`).
      - flaky-rerun.yml:11
  unpinned-images:
    ignore:
      # export.yml (ticket 3050; the engine's copy and the template's) builds
      # in the image its caller names: the one `export --plan` gives, pinned
      # by its digest (`shuyi_cli::export::SNIPER`, which a test holds to
      # `@sha256:`), or the engine's CI matrix's, the same.
      - export.yml:69
