# Dependency upkeep (ticket 2011, ADR-0037). A Dependabot PR is a ticket of
# its own, worked with the `dependency-upkeep` skill. Dependabot's comment
# commands are never used (AGENTS.md rule 11): an `ignore` entry here does
# their job.
version: 2
updates:
  # The pinned Rust (ticket 2012): one PR moves the engine's and the
  # templates' rust-toolchain.toml; the bump-rust skill finishes it.
  # `cargo xtask check-toolchain` fails when a template's folder is left out.
  - package-ecosystem: rust-toolchain
    directories: ["/", "/templates/shuyi-default/base"]
    schedule:
      interval: weekly
    # A quick point release comes out first.
    cooldown:
      default-days: 14
    groups:
      rust-toolchain:
        group-by: dependency-name

  # The workspace (`crates/*`, `examples/*`). The template's manifests hold
  # `{{...}}` placeholders; `cargo xtask check-pins` keeps their
  # requirements equal to the root's.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A crate goes in the first group that matches it.
    groups:
      # These move together, with the JS vendored in crates/cli/web/ and
      # deny.toml's ignores, whatever the update type.
      backend:
        patterns:
          - "macroquad"
          - "miniquad"
          - "quad-*"
          - "sapp-jsutils"
          - "gilrs*"
      # A 0.x bump that breaks semver comes in a PR of its own.
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # The web build's checker (ticket 2019): Playwright for Python and what
  # it pulls in, pinned with their hashes in tools/web-check/requirements.txt,
  # which pip-compile makes from requirements.in. CI only, never shipped.
  - package-ecosystem: pip
    directory: "/tools/web-check"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      web-check:
        patterns:
          - "*"

  # The root's workflows and the templates' (which `shuyi new` copies into
  # every game), in one PR a week so the templates move with the root.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/templates/shuyi-default/base/.github/workflows"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
