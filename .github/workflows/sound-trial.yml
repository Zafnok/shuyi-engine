name: sound-trial

# Temporary, ticket 3031: the Windows capture, before it joins ci.yml.
on:
  push:
    branches: [t3031-sound-output]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: A real render endpoint
        shell: pwsh
        run: tools/sound-parity/install-endpoint.ps1
      - name: The corpus
        run: cargo xtask sound-parity corpus --out target/sound-parity
      - name: Build the probe
        run: cargo build -p shuyi-app --example sound_probe --features sound-probe --release
      - name: Record
        shell: pwsh
        env:
          REVISION: ${{ github.sha }}
        run: python tools/sound-parity/capture.py windows --set-endpoint --dir target/sound-parity --probe target/release/examples/sound_probe.exe --revision "$env:REVISION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sound-parity-windows
          path: target/sound-parity/windows/
          if-no-files-found: error
