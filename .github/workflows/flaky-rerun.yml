name: Flaky re-run

# A failed CI run whose every failed job failed on a cell tools/flaky.ron lists
# is re-run once (ticket 2064); `cargo xtask flaky rerun` decides. A cell not
# listed gets no re-run. The re-run attempt's `ci-result` names the entries in
# a warning, so a re-run never passes without a trace. A run can only be
# re-run once it has finished, so this runs after it, from main: it checks out
# main's code, never the run's, and reads the run's logs and matrix as data.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  rerun:
    name: rerun
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: What the run failed on
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: bash scripts/flaky-failures.sh "$RUN" 1 "$RUNNER_TEMP/failures"
      - name: Whether the ledger lists it
        run: |
          cargo xtask flaky rerun --failures "$RUNNER_TEMP/failures/jobs.json" --attempt 1 \
            --decision "$RUNNER_TEMP/decision"
      - name: Re-run once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          decision=$(cat "$RUNNER_TEMP/decision")
          case "$decision" in
            none) echo "Nothing to re-run." ;;
            failed) gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY" ;;
            *) gh run rerun "$RUN" --job "$decision" --repo "$GITHUB_REPOSITORY" ;;
          esac
