name: sound-calibration

# Ticket 2047's runs, on a scratch branch that is never merged: ci.yml's sound-parity-windows job twenty times on one revision.

on:
  push:
    branches: [t2047-calibration]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  spw-1:
    name: sound-parity-windows (1)
    # Pinned, as its performance budget is measured on this image.
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This scratch file names the chain, which the give-up test refuses.
      - run: rm .github/workflows/sound-calibration.yml
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The output and the backend, with the null output
        run: |
          cargo test -p shuyi-sound-out --locked
          cargo test -p shuyi-app --features in-house-sound --locked in_house
      - name: A real render endpoint
        shell: pwsh
        run: tools/sound-parity/install-endpoint.ps1
      - name: The corpus
        run: cargo xtask sound-parity corpus --out target/sound-parity
      - name: Build the probe of each backend
        run: |
          cargo build -p shuyi-app --example sound_probe --features sound-probe --release --locked
          cp target/release/examples/sound_probe.exe target/sound-parity/probe-old.exe
          cargo build -p shuyi-app --example sound_probe --features sound-probe,in-house-sound --release --locked
          cp target/release/examples/sound_probe.exe target/sound-parity/probe-new.exe
      # A recording the loopback lost frames from is refused and made again (ticket 2047).
      - name: Which recordings are made again
        run: python tools/sound-parity/capture_test.py
      - name: Record both backends
        env:
          REVISION: ${{ github.sha }}
        run: |
          python tools/sound-parity/capture.py windows --set-endpoint --dir target/sound-parity \
            --probe target/sound-parity/probe-old.exe --new-probe target/sound-parity/probe-new.exe --revision "$REVISION" \
            --take-device
      - name: Measure noisy timings again
        env:
          REVISION: ${{ github.sha }}
        run: |
          dir=target/sound-parity
          for platform in windows windows-in-house; do
            for attempt in 1 2; do
              out=$(cargo xtask sound-parity perf "$platform" --dir "$dir" 2>&1) && break
              echo "$out"
              echo "$out" | grep -q inconclusive || break
              echo "::notice::$platform's timings were inconclusive: measuring again"
              mv "$dir/$platform/perf.jsonl" "$dir/$platform/perf-attempt-$attempt.jsonl"
              python tools/sound-parity/capture.py windows --dir "$dir" --probe "$dir/probe-old.exe" \
                --new-probe "$dir/probe-new.exe" --revision "$REVISION" --perf-only --only "$platform"
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sound-parity-windows-1
          path: |
            target/sound-parity/windows/
            target/sound-parity/windows-in-house/
          if-no-files-found: error

