name: sound-calibration

# Ticket 3088's runs, on a scratch branch that is never merged: ci.yml's
# sound-parity jobs many times on one revision with 3088's fix.

on:
  push:
    branches: [t3088-calibration]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  spw-1:
    name: sound-parity-windows (1)
    # Pinned, as its performance budget is measured on this image.
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This scratch file names the chain, which the give-up test refuses.
      - run: rm .github/workflows/sound-calibration.yml
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The output and the backend, with the null output
        run: |
          cargo test -p shuyi-sound-out --locked
          cargo test -p shuyi-app --features in-house-sound --locked in_house
      - name: A real render endpoint
        shell: pwsh
        run: tools/sound-parity/install-endpoint.ps1
      - name: The corpus
        run: cargo xtask sound-parity corpus --out target/sound-parity
      - name: Build the probe of each backend
        run: |
          cargo build -p shuyi-app --example sound_probe --features sound-probe --release --locked
          cp target/release/examples/sound_probe.exe target/sound-parity/probe-old.exe
          cargo build -p shuyi-app --example sound_probe --features sound-probe,in-house-sound --release --locked
          cp target/release/examples/sound_probe.exe target/sound-parity/probe-new.exe
      - name: Record both backends
        env:
          REVISION: ${{ github.sha }}
        run: |
          python tools/sound-parity/capture.py windows --set-endpoint --dir target/sound-parity \
            --probe target/sound-parity/probe-old.exe --new-probe target/sound-parity/probe-new.exe --revision "$REVISION" \
            --take-device
      - name: Measure noisy timings again
        env:
          REVISION: ${{ github.sha }}
        run: |
          dir=target/sound-parity
          for platform in windows windows-in-house; do
            for attempt in 1 2; do
              out=$(cargo xtask sound-parity perf "$platform" --dir "$dir" 2>&1) && break
              echo "$out"
              echo "$out" | grep -q inconclusive || break
              echo "::notice::$platform's timings were inconclusive: measuring again"
              mv "$dir/$platform/perf.jsonl" "$dir/$platform/perf-attempt-$attempt.jsonl"
              python tools/sound-parity/capture.py windows --dir "$dir" --probe "$dir/probe-old.exe" \
                --new-probe "$dir/probe-new.exe" --revision "$REVISION" --perf-only --only "$platform"
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sound-parity-windows-1
          path: |
            target/sound-parity/windows/
            target/sound-parity/windows-in-house/
          if-no-files-found: error

  sp-1:
    name: sound-parity (1)
    needs: spw-1
    # Pinned, as its performance budget is measured on this image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This scratch file names the chain, which the give-up test refuses.
      - run: rm .github/workflows/sound-calibration.yml
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - name: Install the capture's tools and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils libasound2-plugins libpulse0 vorbis-tools
          python3 -m venv "$RUNNER_TEMP/capture"
          "$RUNNER_TEMP/capture/bin/pip" install --require-hashes -r tools/web-check/requirements.txt
          "$RUNNER_TEMP/capture/bin/python" -m playwright install --with-deps chromium
      - name: The gates' own tests
        run: cargo test -p xtask --locked sound_parity
      - name: The web sound ring's indices
        run: node tools/sound-parity/ring_test.js
      - name: The sound core, without std and for the web
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo test -p shuyi-sound --all-features --locked
          cargo test -p shuyi-sound --no-default-features --locked
          cargo build -p shuyi-sound --target thumbv7em-none-eabihf --locked
          cargo build -p shuyi-sound --all-features --target wasm32-unknown-unknown --locked
          cargo test -p shuyi-sound-out --locked
          cargo build -p shuyi-sound-out --target wasm32-unknown-unknown --locked
      - name: The corpus and what a separate decoder makes of it
        run: cargo xtask sound-parity corpus --out target/sound-parity --oracle
      - name: Build the probe, natively and for the web
        run: |
          start=$SECONDS
          cargo build -p shuyi-app --example sound_probe --features sound-probe --release --locked
          echo "NATIVE_BUILD=$((SECONDS - start))" >> "$GITHUB_ENV"
          start=$SECONDS
          cargo build -p shuyi-app --example sound_probe --features sound-probe \
            --target wasm32-unknown-unknown --release --locked
          echo "WEB_BUILD=$((SECONDS - start))" >> "$GITHUB_ENV"
          page=target/sound-parity-page
          rm -rf "$page"
          mkdir -p "$page"
          cp target/wasm32-unknown-unknown/release/examples/sound_probe.wasm crates/cli/web/*.js "$page/"
          sed -e 's/%TITLE%/Sound probe/' -e 's/%WASM%/sound_probe.wasm/' crates/cli/web/index.html > "$page/index.html"
          cargo build -p shuyi-app --example sound_probe --features sound-probe,in-house-sound \
            --target wasm32-unknown-unknown --release --locked
          page=target/sound-parity-page-new
          rm -rf "$page"
          mkdir -p "$page"
          cp target/wasm32-unknown-unknown/release/examples/sound_probe.wasm crates/cli/web/*.js "$page/"
          sed -e 's/%TITLE%/Sound probe/' -e 's/%WASM%/sound_probe.wasm/' crates/cli/web/index.html > "$page/index.html"
      - name: Record the native backend
        env:
          REVISION: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/capture/bin/python" tools/sound-parity/capture.py native --dir target/sound-parity \
            --probe target/release/examples/sound_probe --revision "$REVISION" --build-seconds "$NATIVE_BUILD"
      - name: Record the web backend on its real loader
        env:
          REVISION: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/capture/bin/python" tools/sound-parity/capture.py browser --dir target/sound-parity \
            --page target/sound-parity-page --new-page target/sound-parity-page-new --revision "$REVISION" --build-seconds "$WEB_BUILD"
      - name: What Windows recorded
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sound-parity-windows-1
          path: target/sound-parity
      # A noisy machine's timings say nothing either way, so they are measured
      # again, up to twice; a failed cell stands, as a slowdown shows in the median
      # however often it is measured. Every attempt's samples stay in the artifact.
      - name: The gate
        env:
          REVISION: ${{ github.sha }}
        run: |
          dir=target/sound-parity
          for attempt in 1 2 3; do
            if cargo xtask sound-parity gate --dir "$dir" --revision "$REVISION"; then
              exit 0
            fi
            if [ "$attempt" = 3 ] || jq -e '[.cells[] | select(.mandatory and .status != "passed" and .status != "inconclusive")] | length > 0' "$dir/matrix.json" > /dev/null; then
              exit 1
            fi
            for platform in $(jq -r '[.cells[] | select(.status == "inconclusive") | .platform] | unique | .[]' "$dir/matrix.json"); do
              echo "::notice::$platform's timings were inconclusive: measuring again"
              mv "$dir/$platform/perf.jsonl" "$dir/$platform/perf-attempt-$attempt.jsonl"
              case "$platform" in
                linux-native) "$RUNNER_TEMP/capture/bin/python" tools/sound-parity/capture.py native --dir "$dir" \
                  --probe target/release/examples/sound_probe --revision "$REVISION" --perf-only ;;
                browser-chromium|browser-in-house) "$RUNNER_TEMP/capture/bin/python" tools/sound-parity/capture.py browser --dir "$dir" \
                  --page target/sound-parity-page --new-page target/sound-parity-page-new --revision "$REVISION" --perf-only --only "$platform" ;;
              esac
            done
          done
      - name: A port without capture evidence isn't ready, and the captured ones are
        run: |
          if cargo xtask sound-parity port-ready macos --matrix target/sound-parity/matrix.json; then
            echo "::error::macos was called ready without capture evidence"
            exit 1
          fi
          for platform in linux-native browser-chromium windows windows-in-house browser-in-house; do
            cargo xtask sound-parity port-ready "$platform" --matrix target/sound-parity/matrix.json
          done
      - name: The matrix in the summary
        if: always()
        run: |
          if [ -f target/sound-parity/matrix.json ]; then
            {
              echo '```text'
              jq -r '.cells[] | "\(.platform) \(.check): \(.status) \(.detail)"' target/sound-parity/matrix.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sound-parity-run-1
          path: |
            target/sound-parity/matrix.json
            target/sound-parity/linux-native/
            target/sound-parity/browser-chromium/
            target/sound-parity/browser-in-house/
            target/sound-parity/windows/
            target/sound-parity/windows-in-house/
          if-no-files-found: ignore

