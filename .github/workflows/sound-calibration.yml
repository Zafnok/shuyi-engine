name: sound-calibration

# Ticket 2044's scratch branch, never merged: gathers the sound-parity
# timings of every run since 3031 merged into one small artifact.

on:
  push:
    branches: [t2044-calibration]

permissions:
  contents: read
  actions: read

jobs:
  gather:
    runs-on: ubuntu-24.04
    steps:
      - name: Download each artifact and keep its timings
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: "41776135194:13299592144 41776016897:13298708494 41776135194:13298208074 41776016897:13297901553 41713097066:13272550643 41710593540:13269709750 41710593540:13268523834 41713097066:13268449917 41701622731:13267301432 41701622731:13264188077 41689870848:13262990854 41689870848:13262820468 41689870848:13262743199 41689870848:13262482172 41689870848:13262461923 41689870848:13262251877 41689870848:13262026769 41689870848:13261978165 41689870848:13261716862 41689870848:13261616925 41689870848:13261582375 41689870848:13261503598 41689870848:13261201506 41689870848:13261192605 41689870848:13261166641 41689870848:13261017781 41689870848:13260838892 41689870848:13260818638 41689870848:13260770304 41689870848:13260623494 41689870848:13260490036 41689870848:13260470784 41689870848:13260341412 41689870848:13260331150 41689870848:13260274829 41689870848:13259536032 41689870848:13259201318 41689870848:13259070393 41689870848:13258995055 41689870848:13258860606 41689870848:13258830022 41689870848:13258415208 41689870848:13258376048 41689870848:13258036444 41689870848:13258011067 41689870848:13257916660 41689870848:13257911548 41689870848:13257843679 41689870848:13257519690 41689870848:13257399819 41601761962:13222002581 41601761962:13221030213 41603685474:13218671709 41601761962:13217998361 41601761962:13217545649 41603685474:13217071189 41595469804:13215605644 41595404465:13215228837 41595469804:13214880177 41595469804:13214842215 41595469804:13214653889 41595469804:13214652629 41595469804:13214602536 41595469804:13214581399 41595469804:13214561806 41595469804:13214556580 41595469804:13214444255 41595469804:13214402318 41595469804:13214313114 41595469804:13214234467 41595469804:13214228062 41595469804:13214029116 41595169987:13213894347 41595469804:13213859447 41595404465:13213850081 41595469804:13213682153 41595469804:13213655085 41595469804:13213615215 41595469804:13213556057 41595469804:13213544723 41595469804:13213490361 41595469804:13213433963 41595469804:13213355234 41595469804:13213242332 41595469804:13213233989 41595404465:13213204620 41595469804:13213121882 41595469804:13213069334 41595469804:13213043235 41595469804:13213040838 41595469804:13212967605 41595469804:13212961825 41595469804:13212957027 41595469804:13212878369 41595469804:13212838797 41595469804:13212804304 41595469804:13212749933 41595469804:13212704827 41595169987:13212524162 41595469804:13212289828 41595469804:13212079390 "
        run: |
          mkdir -p out
          for pair in $IDS; do
            run=${pair%%:*}; id=${pair##*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > a.zip || { echo "skip $id"; continue; }
            mkdir -p "out/$run/$id"
            unzip -q a.zip '*.jsonl' '*matrix.json' -x '*/run-*' -d "out/$run/$id" || true
            rm a.zip
          done
          find out -type f | wc -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings
          path: out
