name: sound-calibration

# Ticket 2046's scratch branch, never merged: gathers the native and browser
# sound-parity timings of every run since 2042 merged into one small artifact.

on:
  push:
    branches: [t2046-calibration]

permissions:
  contents: read
  actions: read

jobs:
  gather:
    runs-on: ubuntu-24.04
    steps:
      - name: Download each artifact and keep its timings
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: "41809586244:13314101929 41796857018:13310973857 41796857018:13309345773 41796857018:13309185388 41796857018:13308890633 41796857018:13308745405 41796857018:13308645955 41796857018:13308591314 41796857018:13308376008 41796857018:13307939331 41796857018:13307804508 41792739231:13306216418 41785090975:13303540152 41785090975:13303535204 41785090975:13303510221 41785090975:13303190023 41785090975:13303170585 41785090975:13303162123 41785090975:13303006617 41785090975:13302972323 41785090975:13302926380 41785090975:13302902550 41785090975:13302762866 41785090975:13302727671 41785090975:13302598663 41776135194:13302498378 41785090975:13302489702 41785090975:13302459325 41785090975:13302434588 41785090975:13302424838 41785090975:13302419333 41785090975:13301994917 41785090975:13301959887 41776135194:13301091530 41776135194:13299592144 41776016897:13298708494 41713097066:13272550643 41710593540:13269709750 41701622731:13267301432 41689870848:13262990854 41689870848:13262820468 41689870848:13262743199 41689870848:13262482172 41689870848:13262461923 41689870848:13262251877 41689870848:13262026769 41689870848:13261978165 41689870848:13261716862 41689870848:13261616925 41689870848:13261582375 41689870848:13261503598 41689870848:13261201506 41689870848:13261192605 41689870848:13261166641 41689870848:13261017781 41689870848:13260838892 41689870848:13260818638 41689870848:13260623494 41689870848:13260274829 "
        run: |
          mkdir -p out
          for pair in $IDS; do
            run=${pair%%:*}; id=${pair##*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > a.zip || { echo "skip $id"; continue; }
            mkdir -p "out/$run/$id"
            unzip -q a.zip '*.jsonl' '*matrix.json' -x '*/run-*' -d "out/$run/$id" || true
            rm a.zip
          done
          find out -type f | wc -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings
          path: out
