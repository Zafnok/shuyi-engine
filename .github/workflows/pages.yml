name: Pages

# The website (ticket 2801, ADR-0048): Zola builds `site/` at the Pages
# URL, and each example under `examples/`, built for the web, plays at
# /examples/<name>/ with the NOTICES.txt its build carries. /hello-grid/
# redirects to /examples/hello-grid/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the site's address (`html_url`) from the Pages API.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/setup-zola
      # The base URL is what GitHub serves the site at, so a custom domain
      # (2807) changes it without a change here.
      - name: Read the site's address
        id: address
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)"
          case "$url" in */) ;; *) url="$url/" ;; esac
          echo "base_url=$url" >> "$GITHUB_OUTPUT"
          echo "The site's address: $url"
      - name: Build the site
        working-directory: site
        env:
          BASE_URL: ${{ steps.address.outputs.base_url }}
        run: zola build --base-url "$BASE_URL"
      # Every example whose shuyi.ron has a `web` section, each copied whole
      # (its NOTICES.txt with it) over the stub Zola wrote at its path. An
      # example with no page in site/content/examples/ has no card, and
      # fails the build.
      - name: Build the examples for the web and put them in the site
        run: |
          for ron in examples/*/shuyi.ron; do
            grep -qE '^[[:space:]]*web:[[:space:]]*\(' "$ron" || continue
            dir="$(dirname "$ron")"
            name="$(basename "$dir")"
            [ -f "site/content/examples/$name.md" ] || {
              echo "::error::examples/$name has no card: add site/content/examples/$name.md"
              exit 1
            }
            (cd "$dir" && cargo shuyi web --release)
            dest="site/public/examples/$name"
            rm -rf "$dest"
            mkdir -p "$dest"
            cp -r "$dir/dist/web/." "$dest/"
            [ -f "$dest/NOTICES.txt" ] || { echo "::error::examples/$name's web build has no NOTICES.txt"; exit 1; }
          done
      - name: The site loads nothing from another host
        env:
          BASE_URL: ${{ steps.address.outputs.base_url }}
        run: bash site/check-build.sh hosts site/public "$BASE_URL"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
