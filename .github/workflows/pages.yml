name: Pages

# The examples, built for the web and published: Hello, Grid at
# /hello-grid/, with a page at the root that links to each and to the
# NOTICES.txt its build carries.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build Hello, Grid for the web
        working-directory: examples/hello-grid
        run: cargo shuyi web --release
      - name: Put the examples together
        run: |
          mkdir -p dist/pages
          cp -r examples/hello-grid/dist/web dist/pages/hello-grid
          cat > dist/pages/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Shuyi Engine examples</title>
          </head>
          <body>
          <h1>Shuyi Engine examples</h1>
          <ul>
          <li><a href="hello-grid/">Hello, Grid</a>: a small grid game made from the engine's crates alone (<a href="hello-grid/NOTICES.txt">notices</a>)</li>
          </ul>
          <p><a href="https://github.com/Zafnok/shuyi-engine">The engine's repository</a></p>
          </body>
          </html>
          EOF
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
