name: Pages

# The website (ticket 2801, ADR-0048): Zola builds `site/` at the Pages
# URL, and each example under `examples/`, built for the web, plays at
# /examples/<name>/ with the NOTICES.txt its build carries. /hello-grid/
# redirects to /examples/hello-grid/. The workspace's API docs are at
# /api/ (ticket 2802). `cargo xtask llms` writes the docs for agents into
# it last: llms.txt, llms-full.txt, a Markdown twin of each Learn page and
# the contract's schemas (ticket 2808). Each step of the tutorial, built
# for the web, plays at /learn/tutorial/<step>/play/ (ticket 2803).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the site's address (`html_url`) from the Pages API.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changelog is written from the tags and the whole history
          # (ticket 2804).
          fetch-depth: 0
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/setup-zola
      # The Changelog page and a News post for each release, never
      # committed: written from tickets/done/ and the merges.
      - name: Write the changelog and the release posts
        run: cargo xtask changelog --site site/content
      # The feature cards' statuses, made from the tickets they name and
      # never committed (ticket 2815).
      - name: Write the feature cards' statuses
        run: cargo xtask site-data --site site
      # The base URL is what GitHub serves the site at, so a custom domain
      # (2807) changes it without a change here.
      - name: Read the site's address
        id: address
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)"
          case "$url" in */) ;; *) url="$url/" ;; esac
          echo "base_url=$url" >> "$GITHUB_OUTPUT"
          echo "The site's address: $url"
      # Learn's problem codes, from crates/cli/errors/ (ticket 2802).
      - name: Write the problem codes' pages
        run: bash site/errors.sh
      - name: Build the site
        working-directory: site
        env:
          BASE_URL: ${{ steps.address.outputs.base_url }}
        run: zola build --base-url "$BASE_URL"
      # Every workspace library's API docs at /api/<crate>/ (ticket 2802),
      # which Learn links: each crate site/data/api.toml names must be
      # there. `--lib`: shuyi-cli's binary is also called `shuyi`, and its
      # page would take the front door's place at /api/shuyi/.
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - name: Build the API docs and put them in the site
        run: |
          cargo doc --workspace --no-deps --lib --locked
          rm -rf site/public/api
          cp -r target/doc site/public/api
          for name in $(sed -nE 's/^name = "([a-z0-9_]+)"$/\1/p' site/data/api.toml); do
            [ -f "site/public/api/$name/index.html" ] || {
              echo "::error::site/data/api.toml names $name, and cargo doc built no site/public/api/$name/"
              exit 1
            }
          done
      # Every example whose shuyi.ron has a `web` section, each copied whole
      # (its NOTICES.txt with it) over the stub Zola wrote at its path. An
      # example with no page in site/content/examples/ has no card, and
      # fails the build.
      - name: Build the examples for the web and put them in the site
        run: |
          for ron in examples/*/shuyi.ron; do
            grep -qE '^[[:space:]]*web:[[:space:]]*\(' "$ron" || continue
            dir="$(dirname "$ron")"
            name="$(basename "$dir")"
            [ -f "site/content/examples/$name.md" ] || {
              echo "::error::examples/$name has no card: add site/content/examples/$name.md"
              exit 1
            }
            (cd "$dir" && cargo shuyi web --release)
            dest="site/public/examples/$name"
            rm -rf "$dest"
            mkdir -p "$dest"
            cp -r "$dir/dist/web/." "$dest/"
            [ -f "$dest/NOTICES.txt" ] || { echo "::error::examples/$name's web build has no NOTICES.txt"; exit 1; }
          done
      # Every step of the tutorial (ticket 2803), at the address its page
      # links. Each builds against the engine's code at this commit.
      - name: Build the tutorial's steps for the web and put them in the site
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/tutorial
        run: |
          for dir in site/tutorial/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && cargo update -p shuyi -p shuyi-cli -p shuyi-app && cargo shuyi web --release)
            dest="site/public/learn/tutorial/$name/play"
            mkdir -p "$dest"
            cp -r "$dir/dist/web/." "$dest/"
            [ -f "$dest/NOTICES.txt" ] || { echo "::error::site/tutorial/$name's web build has no NOTICES.txt"; exit 1; }
          done
      # At the base URL Zola built with, after the API docs are in: llms.txt
      # links them, and each link must name a file of the site.
      - name: Write the docs for agents
        env:
          BASE_URL: ${{ steps.address.outputs.base_url }}
        run: cargo xtask llms --public site/public --base-url "$BASE_URL" --commit "$GITHUB_SHA"
      - name: The site loads nothing from another host
        env:
          BASE_URL: ${{ steps.address.outputs.base_url }}
        run: bash site/check-build.sh hosts site/public "$BASE_URL"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
