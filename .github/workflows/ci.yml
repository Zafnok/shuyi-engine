name: CI
# TEST BRANCH for ticket 2021, never merged: only the playtest caller.
on:
  pull_request:
  push:
    branches: [t2021-test-push]
permissions:
  contents: read
jobs:
  playtest:
    name: playtest
    uses: ./.github/workflows/playtest.yml
    with:
      working-directory: examples/hello-grid
      paths: |
        !*.md
        crates/core/src/bots/*
        crates/cli/*
        examples/hello-grid/*
        .github/workflows/playtest.yml
