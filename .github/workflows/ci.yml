name: CI

# The code gates (the game's ticket 1131; they are the game's, game
# ADR-0007: tests are the review), and the repository's own checks (ticket
# 2002): the ticket lint, the link check, the docs map and typos.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: changes
    uses: ./.github/workflows/changes.yml

  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all --check

  # Pedantic: the workspace's lints (Cargo.toml) turn it on.
  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      # The capture mode and Hello, Grid's are behind features (ADR-0052).
      - run: cargo clippy --workspace --all-targets --features shuyi-app/capture,hello-grid/capture --locked -- -D warnings

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set up Linux
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/setup-linux.sh
      - run: cargo test --workspace --locked --no-fail-fast
      # The engine's own code keeps the input and text rules (ticket 2006,
      # the root `shuyi.ron`): `check-keys` and `check-text` in one answer.
      - name: The engine names no key and writes no screen text as a literal
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -q -p shuyi-cli --locked -- lint

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - run: cargo doc --workspace --no-deps --locked

  # The examples built for the web, as Pages publishes them (pages.yml);
  # natively, `test` builds and plays them.
  wasm:
    name: wasm
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `check --target` checks the controls in the game's tool program,
      # which builds natively.
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - name: Hello, Grid fits every target it lists
        working-directory: examples/hello-grid
        run: cargo shuyi check --target all
      # The code compiled for the web alone: the capture mode's and the
      # render card's (ticket 2019).
      - name: Clippy on the web's code
        run: cargo clippy --target wasm32-unknown-unknown -p shuyi-app --features capture --lib --examples --locked -- -D warnings
      - name: Build Hello, Grid for the web
        working-directory: examples/hello-grid
        run: cargo shuyi web --release
      # The notices the build owes (ticket 3039): a crate, the font and a
      # vendored script of the shell.
      - name: The web build carries its notices
        working-directory: examples/hello-grid/dist/web
        run: |
          for needle in "- macroquad " "Terminus" "- mq_js_bundle.js, from macroquad"; do
            grep -qF -- "$needle" NOTICES.txt || { echo "NOTICES.txt lacks: $needle"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-grid-web
          path: examples/hello-grid/dist/web

  # The packages (ticket 3004, ADR-0058): every example exported with
  # `shuyi export <target> --release`, which runs the target's check,
  # remaps the build's paths and refuses a program that still holds one;
  # then tools/export-check/check.sh checks the package's files, the
  # debug file beside it, what the program loads, and on macOS the
  # signature and both slices. `windows`, `linux` and `web` on every PR,
  # `macos` on pushes to main. The Linux package builds in Valve's Steam
  # Linux Runtime 3.0 ("sniper") SDK, Debian 11's glibc 2.31 the floor:
  # its 3.0.20261007.263965, pinned by the digest the registry gave on
  # 2026-10-29 (registry.gitlab.steamos.cloud/v2/steamrt/sniper/sdk/
  # manifests/<tag>; amd64 only). One job over a matrix, each leg its
  # runner and its toolchain's setup.
  export:
    name: export (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [windows, linux, web, macos]
        exclude: ${{ github.event_name == 'push' && fromJSON('[]') || fromJSON('[{"target":"macos"}]') }}
        include:
          - target: windows
            os: windows-latest
          - target: linux
            os: ubuntu-latest
            container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:3.0.20261007.263965@sha256:220d1dc739254155a91c010f959a4f8e7c183e69d18300d6be53a20aee12b02d
          - target: web
            os: ubuntu-latest
          - target: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Linux
        if: matrix.target == 'linux' || matrix.target == 'web'
        run: bash scripts/setup-linux.sh
      - name: Set up Rust
        if: matrix.target != 'linux' && matrix.target != 'web'
        run: rustup show
      # The engine's `.cargo/config.toml` links the GNU target with
      # MSYS2's mingw-w64 GCC, whose binutils give `objcopy`.
      - name: Set up the Windows GNU target
        if: matrix.target == 'windows'
        run: |
          /c/msys64/usr/bin/pacman.exe -Sy --noconfirm --needed mingw-w64-x86_64-gcc
          echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
          rustup target add x86_64-pc-windows-gnu
      - name: Set up both Mac targets
        if: matrix.target == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: export-${{ matrix.target }}
      - name: Export Hello, Grid
        working-directory: examples/hello-grid
        run: cargo shuyi export "$TARGET" --release
      - name: Check the package
        run: bash tools/export-check/check.sh "$TARGET" examples/hello-grid/dist/export/"$TARGET"
      # The `.app` keeps its signature and its program's mode in a zip
      # `ditto` writes; the artifact's own zip would drop them.
      - name: Zip the macOS package
        if: matrix.target == 'macos'
        working-directory: examples/hello-grid/dist/export/macos
        run: ditto -c -k --keepParent "$(ls -d hello-grid-*-macos)" hello-grid-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-grid-export-${{ matrix.target }}
          path: |
            examples/hello-grid/dist/export/${{ matrix.target }}/*.zip
            examples/hello-grid/dist/export/${{ matrix.target }}/*.tar.gz
            examples/hello-grid/dist/export/${{ matrix.target }}/*.debug
            examples/hello-grid/dist/export/${{ matrix.target }}/export-report.json
          retention-days: 7

  # The real window checked (ticket 2018, ADR-0052): Hello, Grid run in its
  # window as its plan says, under Xvfb with Mesa's llvmpipe (software GL:
  # no GPU runner), each capture's window compared with the raster's
  # picture of the same frame within the plan's tolerance. First the
  # render card (ticket 2392): every kind of thing a frame draws, in the
  # window and compared the same way. The plan runs twice and both runs'
  # pictures must be byte for byte the same, and a plan with a key name
  # that doesn't exist must not run (exit 2). Each
  # run's `capture.txt` goes in the job's summary, and every picture is
  # uploaded, a failing capture's diff among them.
  render:
    name: render
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - name: Install Xvfb and Mesa's software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri mesa-utils
      - name: The renderer and Mesa's version
        run: xvfb-run -a -s "-screen 0 1280x1024x24" glxinfo -B
      - name: The capture mode's tests
        run: cargo test -p shuyi-app -p shuyi-platform --features shuyi-app/capture --locked
      - name: The render card, every kind of thing a frame draws
        run: |
          cargo build -p shuyi-app --example render_card --features capture --locked
          SHUYI_CAPTURE_OUT=target/capture/card \
            xvfb-run -a -s "-screen 0 1280x1024x24" target/debug/examples/render_card
      - name: Build Hello, Grid with the capture mode
        run: cargo build -p hello-grid --features capture --locked
      - name: Hello, Grid's plan, twice, the same pictures both times
        run: |
          for out in hello-grid hello-grid-again; do
            SHUYI_CAPTURE=examples/hello-grid/capture/frames.ron SHUYI_CAPTURE_OUT="target/capture/$out" \
              xvfb-run -a -s "-screen 0 1280x1024x24" target/debug/hello-grid
          done
          for file in target/capture/hello-grid/*.window.png target/capture/hello-grid/*.raster.png; do
            cmp "$file" "target/capture/hello-grid-again/$(basename "$file")"
          done
      - name: A plan with an unknown key doesn't run
        run: |
          printf '(steps: [wait(1), keys("Entr"), capture("title")])\n' > "$RUNNER_TEMP/unknown-key.ron"
          code=0
          SHUYI_CAPTURE="$RUNNER_TEMP/unknown-key.ron" SHUYI_CAPTURE_OUT="$RUNNER_TEMP/unknown-key" \
            xvfb-run -a -s "-screen 0 1280x1024x24" target/debug/hello-grid || code=$?
          if [ "$code" != 2 ]; then
            echo "::error::hello-grid exited $code on a plan with an unknown key, not 2"
            exit 1
          fi
      - name: The captures in the summary
        if: always()
        run: |
          for file in target/capture/*/capture.txt; do
            [ -f "$file" ] || continue
            {
              echo "### ${file#target/capture/}"
              echo '```text'
              cat "$file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: render-captures
          path: target/capture/
          if-no-files-found: ignore

  # The web build checked (ticket 2019): each web build headless Chromium
  # opens on 127.0.0.1 (tools/web-check/check.py, with Playwright for
  # Python), WebGL drawn by SwiftShader (no GPU runner). A console error, a
  # page error, a failed request or a canvas of one colour fails it. First
  # the checker's own fixtures, which must fail; then every example
  # pages.yml publishes, booted; then a copy of Hello, Grid's page without
  # `var register_plugin;` (game ticket 0225), which must fail; then
  # Hello, Grid's capture build and the render card, each capture compared
  # with the raster inside the page as the `render` job does on the
  # desktop. Every page's canvas and console are uploaded.
  web-render:
    name: web-render
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - name: Install the checker and Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/web-check"
          "$RUNNER_TEMP/web-check/bin/pip" install --require-hashes -r tools/web-check/requirements.txt
          "$RUNNER_TEMP/web-check/bin/python" -m playwright install --with-deps chromium
      - name: The checker's fixtures fail
        run: |
          "$RUNNER_TEMP/web-check/bin/python" tools/web-check/check.py fixtures --out target/web-check/fixtures
      # As pages.yml builds them: every example whose shuyi.ron has a
      # `web` section.
      - name: Every example's web build boots
        run: |
          for ron in examples/*/shuyi.ron; do
            grep -qE '^[[:space:]]*web:[[:space:]]*\(' "$ron" || continue
            dir="$(dirname "$ron")"
            name="$(basename "$dir")"
            (cd "$dir" && cargo shuyi web --release)
            rm -rf "target/web/$name"
            mkdir -p "target/web/$name"
            cp -r "$dir/dist/web/." "target/web/$name/"
            "$RUNNER_TEMP/web-check/bin/python" tools/web-check/check.py boot "target/web/$name" \
              --out "target/web-check/boot-$name"
          done
      - name: A page without `var register_plugin;` fails
        run: |
          page="$RUNNER_TEMP/no-register-plugin"
          cp -r target/web/hello-grid "$page"
          sed -i '/^  var register_plugin;$/d' "$page/index.html"
          code=0
          "$RUNNER_TEMP/web-check/bin/python" tools/web-check/check.py boot "$page" \
            --out target/web-check/no-register-plugin > "$RUNNER_TEMP/no-register-plugin.txt" || code=$?
          cat "$RUNNER_TEMP/no-register-plugin.txt"
          if [ "$code" != 1 ] || ! grep -qF "register_plugin is not defined" "$RUNNER_TEMP/no-register-plugin.txt"; then
            echo "::error::check.py didn't fail the page without var register_plugin;"
            exit 1
          fi
      - name: Hello, Grid's plan in the browser
        working-directory: examples/hello-grid
        run: |
          cargo shuyi web --release --capture
          cp capture/frames.ron dist/web/capture.ron
          "$RUNNER_TEMP/web-check/bin/python" ../../tools/web-check/check.py capture dist/web \
            --out ../../target/web-check/capture-hello-grid
      # The card's window is its 256 × 192 pixels times 3
      # (crates/app/examples/render_card.rs).
      - name: The render card in the browser
        run: |
          cargo build -p shuyi-app --example render_card --features capture \
            --target wasm32-unknown-unknown --release --locked
          page=target/web/render-card
          rm -rf "$page"
          mkdir -p "$page"
          cp target/wasm32-unknown-unknown/release/examples/render_card.wasm crates/cli/web/*.js "$page/"
          sed -e 's/%TITLE%/Render card/' -e 's/%WASM%/render_card.wasm/' crates/cli/web/index.html > "$page/index.html"
          "$RUNNER_TEMP/web-check/bin/python" tools/web-check/check.py capture "$page" --size 768x576 \
            --out target/web-check/capture-render-card
      - name: The consoles in the summary
        if: always()
        run: |
          for file in target/web-check/*/console.txt target/web-check/fixtures/*/console.txt; do
            [ -f "$file" ] || continue
            {
              echo "### ${file#target/web-check/}"
              echo '```text'
              cat "$file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-render
          path: target/web-check/
          if-no-files-found: ignore

  # The first gate on leaving quad-snd (ticket 2573, ADR-0066): what the
  # backend really emits, recorded from a PulseAudio null sink natively and
  # from Chromium on the real loader, held to expected signals, to itself and
  # to its speed. tools/sound-parity/README.md says what each cell means. No
  # replacement work starts without it passing, and no cell may be skipped:
  # missing, stale or silent evidence fails.
  sound-parity:
    name: sound-parity
    needs: changes
    if: needs.changes.outputs.sound == 'true'
    # Pinned, as its performance budget is measured on this image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - name: Install the capture's tools and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils libasound2-plugins libpulse0 vorbis-tools
          python3 -m venv "$RUNNER_TEMP/capture"
          "$RUNNER_TEMP/capture/bin/pip" install --require-hashes -r tools/web-check/requirements.txt
          "$RUNNER_TEMP/capture/bin/python" -m playwright install --with-deps chromium
      - name: The gates' own tests
        run: cargo test -p xtask --locked sound_parity
      - name: The corpus and what a separate decoder makes of it
        run: cargo xtask sound-parity corpus --out target/sound-parity --oracle
      - name: Build the probe, natively and for the web
        run: |
          start=$SECONDS
          cargo build -p shuyi-app --example sound_probe --features sound-probe --release --locked
          echo "NATIVE_BUILD=$((SECONDS - start))" >> "$GITHUB_ENV"
          start=$SECONDS
          cargo build -p shuyi-app --example sound_probe --features sound-probe \
            --target wasm32-unknown-unknown --release --locked
          echo "WEB_BUILD=$((SECONDS - start))" >> "$GITHUB_ENV"
          page=target/sound-parity-page
          rm -rf "$page"
          mkdir -p "$page"
          cp target/wasm32-unknown-unknown/release/examples/sound_probe.wasm crates/cli/web/*.js "$page/"
          sed -e 's/%TITLE%/Sound probe/' -e 's/%WASM%/sound_probe.wasm/' crates/cli/web/index.html > "$page/index.html"
      - name: Record the native backend
        env:
          REVISION: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/capture/bin/python" tools/sound-parity/capture.py native --dir target/sound-parity \
            --probe target/release/examples/sound_probe --revision "$REVISION" --build-seconds "$NATIVE_BUILD"
      - name: Record the web backend on its real loader
        env:
          REVISION: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/capture/bin/python" tools/sound-parity/capture.py browser --dir target/sound-parity \
            --page target/sound-parity-page --revision "$REVISION" --build-seconds "$WEB_BUILD"
      # A noisy machine's timings say nothing either way, so they are measured
      # again, up to twice; a failed cell stands, as a slowdown shows in the median
      # however often it is measured. Every attempt's samples stay in the artifact.
      - name: The gate
        env:
          REVISION: ${{ github.sha }}
        run: |
          dir=target/sound-parity
          for attempt in 1 2 3; do
            if cargo xtask sound-parity gate --dir "$dir" --revision "$REVISION"; then
              exit 0
            fi
            if [ "$attempt" = 3 ] || jq -e '[.cells[] | select(.mandatory and .status != "passed" and .status != "inconclusive")] | length > 0' "$dir/matrix.json" > /dev/null; then
              exit 1
            fi
            for platform in $(jq -r '[.cells[] | select(.status == "inconclusive") | .platform] | unique | .[]' "$dir/matrix.json"); do
              echo "::notice::$platform's timings were inconclusive: measuring again"
              mv "$dir/$platform/perf.jsonl" "$dir/$platform/perf-attempt-$attempt.jsonl"
              case "$platform" in
                linux-native) "$RUNNER_TEMP/capture/bin/python" tools/sound-parity/capture.py native --dir "$dir" \
                  --probe target/release/examples/sound_probe --revision "$REVISION" --perf-only ;;
                browser-chromium) "$RUNNER_TEMP/capture/bin/python" tools/sound-parity/capture.py browser --dir "$dir" \
                  --page target/sound-parity-page --revision "$REVISION" --perf-only ;;
              esac
            done
          done
      - name: A port without capture evidence isn't ready, and the captured ones are
        run: |
          for platform in windows macos; do
            if cargo xtask sound-parity port-ready "$platform" --matrix target/sound-parity/matrix.json; then
              echo "::error::$platform was called ready without capture evidence"
              exit 1
            fi
          done
          cargo xtask sound-parity port-ready linux-native --matrix target/sound-parity/matrix.json
          cargo xtask sound-parity port-ready browser-chromium --matrix target/sound-parity/matrix.json
      - name: The matrix in the summary
        if: always()
        run: |
          if [ -f target/sound-parity/matrix.json ]; then
            {
              echo '```text'
              jq -r '.cells[] | "\(.platform) \(.check): \(.status) \(.detail)"' target/sound-parity/matrix.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sound-parity
          path: |
            target/sound-parity/matrix.json
            target/sound-parity/linux-native/
            target/sound-parity/browser-chromium/
          if-no-files-found: ignore

  # Nick can scrap the sound replacement in one session at any stage until
  # quad-snd is removed (ADR-0068): this really does it, and builds what is
  # left, so the way back can't rot while nobody is looking.
  sound-give-up:
    name: sound-give-up
    needs: changes
    if: needs.changes.outputs.sound == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - name: Give up, in this checkout
        run: cargo xtask sound-parity give-up --apply
      - name: What is left builds, for the desktop and the web
        run: |
          cargo check --workspace --all-targets
          cargo check -p shuyi-app --target wasm32-unknown-unknown
      - name: What is left passes its checks
        run: |
          cargo test -p shuyi-app -p xtask
          cargo xtask check-layers
          cargo xtask check-docs
          cargo xtask check-links
          pwsh -File scripts/sync-agent-skills.ps1 -Check
      - name: Nothing of it is left outside the record
        run: |
          if git grep -l -I -E 'sound-parity|sound_parity|sound_probe|sound-probe|SoundProbeBackend|in-house-sound|shuyi-sound|shuyi_sound' \
            -- . ':!tickets' ':!docs/adr' ':!docs/research' ':!docs/decisions.md' ':!docs/ROADMAP.md'; then
            echo "::error::Giving up left these behind"
            exit 1
          fi

  # `shuyi new` (tickets 1129 and 2501): a game made with each short name
  # of the engine's template (templates/shuyi-default), on this checkout of
  # the engine, passes the gates its own CI runs. It builds in this
  # repository's target folder, which rust-cache keeps.
  #
  # It starts from a bare Ubuntu (ticket 2513), as a cloud agent's
  # container does: scripts/setup-linux.sh installs everything from
  # nothing, doctor passes, and the game's own copy of the script then
  # finds nothing to do. In a container job the `github.workspace` and
  # `runner.temp` contexts are the host's paths, so the steps use the
  # `$GITHUB_WORKSPACE` and `$RUNNER_TEMP` variables.
  templates:
    name: templates (${{ matrix.template }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        template: [grid, blank]
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    env:
      TEMPLATE: ${{ matrix.template }}
    steps:
      # The image has no git: checkout downloads the commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Linux from nothing
        run: bash scripts/setup-linux.sh
      - run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: template-${{ matrix.template }}
      - name: The engine's doctor passes
        run: cargo run -q -p shuyi-cli --locked -- doctor
      # `shuyi lint finds what breaks the game's code` reads its JSON with jq.
      - run: apt-get install -y --no-install-recommends jq
      - name: Make a game with shuyi new
        run: cargo run -q -p shuyi-cli --locked -- new "$RUNNER_TEMP/demo" --template "$TEMPLATE" --engine-path "$GITHUB_WORKSPACE"
      - name: The game's own setup script finds nothing to do
        run: bash "$RUNNER_TEMP/demo/scripts/setup-linux.sh" | tee "$RUNNER_TEMP/setup.txt" && grep -q 'everything was there already' "$RUNNER_TEMP/setup.txt"
      - name: Run its gates
        run: |
          cd "$RUNNER_TEMP/demo"
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo shuyi check
          cargo shuyi check --target all
          cargo shuyi check-keys
          cargo shuyi lint
          cargo shuyi doctor
      # Ticket 2548: a long name lays out the same, so the game's own fmt
      # gate passes whatever it is called. It uses the older form, `new
      # <template> <dir>`, which keeps working (ticket 2501).
      - name: A game with a long name passes cargo fmt
        run: |
          cargo run -q -p shuyi-cli --locked -- new "$TEMPLATE" "$RUNNER_TEMP/long" \
            --name "A Much Longer Game Name Than Demo, To Test" --engine-path "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/long" && cargo fmt --all --check
      # `shuyi lint` (ticket 2534): one finding each, with file and line,
      # for a hash map, a float, a clock and float arithmetic in the rules,
      # a screen crate under them, a key named in a screen and a screen's
      # literal text; without `rules` in shuyi.ron, a limit says so.
      - name: shuyi lint finds what breaks the game's code
        if: matrix.template == 'grid'
        run: |
          cd "$RUNNER_TEMP/demo"
          cp -r crates "$RUNNER_TEMP/crates" && cp shuyi.ron "$RUNNER_TEMP/shuyi.ron"
          cat >> crates/rules/src/lib.rs <<'RUST'

          /// Breaks every rule the fence names.
          pub fn breaks_the_rules(tiles: &std::collections::BTreeMap<u8, u8>) -> usize {
              let _ = std::collections::HashMap::<u8, u8>::new();
              let _: f32 = 0.0;
              let _ = std::time::Instant::now();
              let _ = 1.5 * 2.0;
              tiles.len()
          }
          RUST
          # By path: the game's workspace names the engine as `shuyi` (and
          # the crates its rules may use), not `shuyi-ui`.
          echo "shuyi-ui = { path = '$GITHUB_WORKSPACE/crates/ui' }" >> crates/rules/Cargo.toml
          cat >> crates/game/src/stages/top_down_grid.rs <<'RUST'

          /// Names a key and writes a screen's text.
          pub fn breaks_the_screens(buf: &mut GlyphBuffer, fg: shuyi::ui::frame::Rgb) {
              buf.print(0, 0, "Press Space to go", fg, fg);
          }
          RUST
          if cargo shuyi lint --json > lint.json; then
            cat lint.json
            echo "::error::shuyi lint passed on code that breaks the rules"
            exit 1
          fi
          found=$(jq -r '.result.findings[] | "\(.code) \(.file):\(.line)"' lint.json)
          echo "$found"
          for expected in 'SH2101 crates/game/src/stages/top_down_grid.rs'             'SH2102 crates/game/src/stages/top_down_grid.rs' \
            'SH2104 crates/rules/Cargo.toml:null'; do
            if ! grep -qF "$expected" <<< "$found"; then
              echo "::error::shuyi lint did not find: $expected"
              exit 1
            fi
          done
          if [ "$(grep -c '^SH2103 crates/rules/src/lib.rs:[0-9]' <<< "$found")" != 4 ]; then
            echo "::error::shuyi lint did not find the fence's four breaks, one each"
            exit 1
          fi
          jq -e '.result.findings[] | select(.code == "SH2104") | .command == "cargo tree -p demo-rules -i shuyi-ui"' lint.json
          rm -r crates && cp -r "$RUNNER_TEMP/crates" crates
          sed -i '/^    rules: /d' shuyi.ron
          cargo shuyi lint --json > lint.json
          jq -e '.ok and (.limits | any(test("names no rules package")))' lint.json
          cp "$RUNNER_TEMP/shuyi.ron" shuyi.ron
      # The rules crate's fence (ticket 2015, ADR-0032 §4): clippy names a
      # hash map, a float, a clock and float arithmetic in the rules, and
      # the layers test fails on a screen crate under them.
      - name: The rules crate's fence holds
        if: matrix.template == 'grid'
        run: |
          cd "$RUNNER_TEMP/demo"
          lib=crates/rules/src/lib.rs
          cp "$lib" "$RUNNER_TEMP/lib.rs"
          cat >> "$lib" <<'RUST'

          /// Breaks every rule the fence names.
          pub fn breaks_the_rules(_tiles: &std::collections::HashMap<u8, u8>, x: f32) -> f32 {
              let _ = std::time::Instant::now();
              x + 1.5 * 2.0
          }
          RUST
          if cargo clippy -p demo-rules --message-format=short -- -D warnings 2> clippy.txt; then
            echo "::error::clippy passed on rules that break the fence"
            exit 1
          fi
          for message in \
            'disallowed type `std::collections::HashMap`' \
            'disallowed type `f32`' \
            'disallowed method `std::time::Instant::now`' \
            'floating-point arithmetic detected'; do
            if ! grep -qF "$message" clippy.txt; then
              cat clippy.txt
              echo "::error::clippy did not say: $message"
              exit 1
            fi
          done
          cp "$RUNNER_TEMP/lib.rs" "$lib"
          # By path: the game's workspace names the engine as `shuyi` (and
          # the crates its rules may use), not `shuyi-ui`.
          echo "shuyi-ui = { path = '$GITHUB_WORKSPACE/crates/ui' }" >> crates/rules/Cargo.toml
          if cargo test -p demo-rules --test layers > layers.txt 2>&1; then
            echo "::error::the layers test passed on rules that depend on shuyi-ui"
            exit 1
          fi
          if ! grep -qF 'demo-rules depends on shuyi-ui' layers.txt; then
            cat layers.txt
            echo "::error::the layers test did not name shuyi-ui"
            exit 1
          fi

  # Hello, Grid's bots through the reusable playtest workflow (ticket 2021):
  # the test of playtest.yml itself. It plays when the bots, the tools or
  # the example change; its report is in the job's summary.
  playtest:
    name: playtest
    uses: ./.github/workflows/playtest.yml
    with:
      working-directory: examples/hello-grid
      paths: |
        !*.md
        crates/core/src/bots/*
        crates/cli/*
        examples/hello-grid/*
        .github/workflows/playtest.yml

  # The skill pack (ticket 1134, ADR-0043): each skill's worked example, a
  # script of contract commands, run on a game fresh from `shuyi new` on
  # this checkout (`cargo xtask skill-examples`), in shards. The games
  # build in this repository's target folder, which rust-cache keeps.
  # `check-skills` runs in the `test` job (crates/cli/tests/it/skills.rs).
  skills:
    name: skills (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      # `shuyi-ship`'s example builds its game for the web.
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: skills-${{ strategy.job-index }}
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - name: Run the worked examples
        run: cargo xtask skill-examples --shard "$SHARD"

  # What a game's developer waits for (ticket 2009, ADR-0049): a new `grid`
  # game's rebuild after a one-line change, timed with the template's own
  # setup in its own target folder, and a new game's dependency count, held
  # to tools/compile-budget.ron. The table is in the job's summary. The
  # games are made outside the target folder rust-cache keeps, so each
  # build starts clean.
  compile-times:
    name: compile-times (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set up Linux
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/setup-linux.sh
      - name: Time a new game against the budget
        run: cargo xtask compile-times --budget tools/compile-budget.ron --summary "$GITHUB_STEP_SUMMARY" --dir "$RUNNER_TEMP/compile-times"

  # The crates a Playdate game builds without `std` (ADR-0008 §5, ticket
  # 3005): built for a target that has no `std` at all, their tests run
  # without `std` on the host, and no `std::` path outside
  # `cfg(feature = "std")`.
  no-std:
    name: no-std
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p shuyi-core -p shuyi-ui -p shuyi-platform -p shuyi-alloc-count --no-default-features --target thumbv7em-none-eabihf --locked
      - run: cargo build -p shuyi-assets --no-default-features --target thumbv7em-none-eabihf --locked
      - run: cargo build -p shuyi-ui --no-default-features --features raster --target thumbv7em-none-eabihf --locked
      - run: cargo build -p shuyi-platform --no-default-features --features capture --target thumbv7em-none-eabihf --locked
      # The Playdate backend as the device links it, and a game on it. The SDK
      # itself stays out of CI: its license gives no leave to fetch it on a
      # runner, so `shuyi export playdate` runs on a developer's machine.
      - run: cargo build -p shuyi-playdate --target thumbv7em-none-eabihf --locked
        env:
          RUSTFLAGS: --cfg shuyi_playdate_sdk
      - run: cargo build -p hello-grid --lib --no-default-features --features playdate --target thumbv7em-none-eabihf --locked
      - run: cargo xtask check-no-std
      # The same tests as with `std`, the headless backend's included. The
      # test harness and the dev-dependencies bring `std` into the build,
      # and with it `std`'s own float methods, which win over the `Float`
      # trait the `no_std` code imports: those imports are unused here
      # only. The target build above denies every warning.
      - name: The tests without std
        env:
          RUSTFLAGS: -D warnings -A unused-imports
        run: cargo test -p shuyi-core -p shuyi-ui -p shuyi-platform --no-default-features --locked --no-fail-fast

  # The same state on every platform (ADR-0002 §2, ticket 2116). x64 and
  # ARM64 are the `test` job's legs (`macos-latest` is Apple silicon); this
  # job adds the 32-bit target the web build ships, wasm32, under wasmtime
  # (WASI preview 1): every unit and integration test of the crates that
  # build without a device backend, and Hello, Grid's golden test (its
  # record replayed, its assets read, and read back from a pack baked
  # here). A new example with a golden table adds its own step, with its
  # window feature off. The workspace is mapped at its own path, so the
  # paths compiled into the tests (insta's snapshots, proptest's
  # regressions) open as they do natively. A failing test aborts its whole
  # binary on wasm32: `--nocapture` shows why, `--no-fail-fast` runs the
  # others. Doctests stay native.
  determinism:
    name: determinism
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=${{ github.workspace }}::${{ github.workspace }} --env=CI=true --env=INSTA_UPDATE=no --env=INSTA_WORKSPACE_ROOT=${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The run-gates skill names this version for a local run.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasmtime@49.0.3
      - name: The engine's crates' tests on wasm32
        run: cargo test --target wasm32-wasip1 --locked --no-fail-fast --lib --tests -p shuyi-core -p shuyi-assets -p shuyi-ui -p shuyi-platform -- --nocapture
      - name: Hello, Grid's golden table on wasm32
        run: cargo test --target wasm32-wasip1 --locked --no-fail-fast -p hello-grid --no-default-features --test golden -- --nocapture

  # The crates' layers as tools/layers.ron writes them (ticket 2015,
  # ADR-0032): which engine crate depends on which, the outside crates of
  # the pure ones, no device crate below any crate but the backend's, and
  # the float ban in the simulations. It replaces the `platform-deps` job.
  layers:
    name: layers
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo xtask check-layers

  # The modules (ticket 2003, ADR-0009 §2 and §6): each against the
  # catalog (docs/modules.md, docs/modules.ron), then the `shuyi` crate
  # built as the default engine, with each module's feature alone, and
  # with every one, whose modules install side by side (its tests). It
  # doesn't try every combination.
  modules:
    name: modules
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - run: cargo xtask check-modules
      - name: The default engine, each module alone, and every module together
        run: |
          cargo build -p shuyi --locked
          features=$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.name == "shuyi") | .features | keys[]')
          for feature in $features; do
            echo "::group::shuyi with $feature"
            cargo build -p shuyi --features "$feature" --locked
            echo "::endgroup::"
          done
          cargo test -p shuyi --all-features --locked

  # The public API of the crates a game uses (ticket 2010, ADR-0038): what
  # merging adds to each crate's listing (cargo-public-api) and its breaks
  # (cargo-semver-checks), against the base's tip, in the job summary. A
  # break needs a `Breaking:` line in the branch's ticket, and a change
  # that changes no file of the book a `Book:` line saying why (ticket
  # 2815). On a pull request HEAD is the merge commit and HEAD^1 the
  # base's tip, as in changes.yml.
  api:
    name: api
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.crates == 'true'
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.verdict.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: rustup show
      # The nightly, and the tools' versions below, are the consts in
      # crates/xtask/src/api.rs; they move with rust-toolchain.toml.
      - run: rustup toolchain install nightly-2026-07-06 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `shuyi-app`'s dependencies need them to be documented.
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-semver-checks@0.51.0
      # install-action doesn't carry cargo-public-api.
      - run: cargo install --locked cargo-public-api@0.52.0
      - name: Show the public API change
        env:
          HEAD_REF: ${{ github.head_ref }}
          # Warnings are the clippy and test jobs' gate: a lint only the
          # nightly has must not fail this job as a build error.
          RUSTFLAGS: ""
        run: cargo xtask api --base HEAD^1 --pr-branch "$HEAD_REF" --summary "$GITHUB_STEP_SUMMARY" --verdict "$RUNNER_TEMP/api-verdict"
      - name: Hand the verdict to api-label
        id: verdict
        run: echo "label=$(cat "$RUNNER_TEMP/api-verdict")" >> "$GITHUB_OUTPUT"

  # The api job's verdict as one label on the PR, `api: none`, `api: added`
  # or `api: breaking` (ticket 2030, ADR-0038's *The verdict as a label*):
  # other repositories can't read a job summary, but anyone reads a public
  # PR's labels. The game's watcher (game#1190) reads it to move its pin.
  # A PR that changes nothing under crates/ is `api: none`; a failed api
  # job sets no label. A job of its own, so the token that writes labels
  # never meets the PR's code: no checkout, no build. A fork's PR gets a
  # read-only token, so it is left unlabelled and readers fall back to
  # their own test.
  api-label:
    name: api-label
    needs: [changes, api]
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.changes.result == 'success'
      && (needs.changes.outputs.crates != 'true' || needs.api.result == 'success')
    runs-on: ubuntu-latest
    # Only this job writes to the PR, and only its labels.
    permissions:
      pull-requests: write
    steps:
      - name: Label the PR with its verdict
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CRATES: ${{ needs.changes.outputs.crates }}
          VERDICT: ${{ needs.api.outputs.label }}
        run: |
          if [ "$CRATES" != "true" ]; then VERDICT=none; fi
          case "$VERDICT" in
            none|added|breaking) ;;
            *) echo "::error::No verdict from the api job: '$VERDICT'."; exit 1 ;;
          esac
          # The PR's labels with every `api:` one replaced by the verdict's.
          labels=()
          while IFS= read -r label; do
            labels+=(-f "labels[]=$label")
          done < <(gh api "repos/$GH_REPO/issues/$PR/labels" --paginate --jq '.[].name | select(startswith("api: ") | not)')
          gh api -X PUT "repos/$GH_REPO/issues/$PR/labels" "${labels[@]}" -f "labels[]=api: $VERDICT" --jq '[.[].name] | join(", ")'

  # Licenses, advisories, bans and sources (deny.toml).
  deny:
    name: deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The workflows audited (ticket 2011, ADR-0037 §4): `.` collects every
  # `.github/workflows` folder below it, the templates' included. Findings
  # fail the job and show in its log; a finding wrong for this repository
  # goes in .github/zizmor.yml with why.
  zizmor:
    name: zizmor
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .
          min-severity: medium
          advanced-security: false

  # Dependencies no crate uses.
  machete:
    name: machete
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete
      - run: cargo machete

  # Coverage without the platform backend, a Clippy report, and the
  # SonarCloud scan (ticket 2007, ADR-0017; copied from the game's job).
  # The scan is skipped where the secret is absent, as on a fork's PR.
  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup show
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --exclude shuyi-app --locked --lcov --output-path lcov.info
      - name: Generate Clippy report for SonarCloud
        run: cargo clippy --workspace --all-targets --locked --message-format=json > clippy.json
        continue-on-error: true
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The ticket lint, the Markdown links, the pins (`check-pins`), the
  # pinned Rust (`check-toolchain`), the docs map (`check-docs`) and typos.
  # Cheap, and tickets and
  # docs are what they check, so this always runs: never gated on
  # `needs.changes` (game ADR-0014), like the game's `tickets` job.
  tickets:
    name: tickets
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
      EVENT_NAME: ${{ github.event_name }}
      # For `gh api` on the game's tickets (`game#NNNN` ids). Without access
      # to the game repository the lint warns and skips those ids.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check shared agent skill loaders
        shell: pwsh
        run: ./scripts/sync-agent-skills.ps1 -Check
      - name: Run ticket lint
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            cargo xtask ticket-lint --pr-branch "$HEAD_REF"
          else
            cargo xtask ticket-lint
          fi
      - name: Check Markdown links
        run: cargo xtask check-links
      # A `migration` block that doesn't parse fails here, not when the
      # site is built (ticket 2804).
      - name: Check the changelog can be written
        run: cargo xtask changelog > /dev/null
      - name: Check the actions' pins and the templates' requirements
        run: cargo xtask check-pins
      - name: Check the pinned Rust
        run: cargo xtask check-toolchain
      - name: Check the docs map
        run: cargo xtask check-docs
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: typos
      - name: Check spelling
        run: typos

  # The website (ticket 2801, ADR-0048): Zola's check of its internal links
  # and anchors (`@/…`; no network), and site/check-build.sh: two base URLs
  # give outputs that never name each other's, and no page loads anything
  # from another host. Then the docs for agents over a build (ticket 2808):
  # no shortcode left unexpanded, every llms.txt link resolving but the API
  # docs' (pages.yml builds those), and llms-full.txt under its budget.
  # The feature cards' statuses come from their tickets (ticket 2815).
  # Cheap, and Markdown is what it reads, so this always runs, like
  # `tickets`. pages.yml builds and publishes the site on main.
  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/setup-zola
      - name: Write the problem codes' pages
        run: bash site/errors.sh
      # check-build.sh checks the home page shows them (ticket 2815).
      - name: Write the feature cards' statuses
        run: cargo xtask site-data --site site
      - name: Check the site's links
        working-directory: site
        run: zola check --skip-external-links
      - name: Check the site's builds
        run: bash site/check-build.sh
      - name: Check the docs for agents
        env:
          BASE_URL: https://zafnok.github.io/shuyi-engine/
        run: |
          out="$RUNNER_TEMP/site"
          (cd site && zola build --base-url "$BASE_URL" --output-dir "$out" --force)
          cargo xtask llms --public "$out" --base-url "$BASE_URL" --commit "$GITHUB_SHA"

  # Single required check for this workflow. Matrix jobs skipped by `if:`
  # report one check with an unexpanded name, never the per-leg names, so
  # branch protection requires this job instead (game ADR-0014).
  ci-result:
    name: ci-result
    if: always()
    needs: [changes, fmt, clippy, test, docs, wasm, export, render, web-render, sound-parity, sound-give-up, templates, playtest, skills, compile-times, no-std, determinism, layers, modules, api, api-label, deny, zizmor, machete, coverage, tickets, site]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi
