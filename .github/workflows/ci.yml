name: CI

# The code gates (the game's ticket 1131; they are the game's, game
# ADR-0007: tests are the review), and the repository's own checks (ticket
# 2002): the ticket lint, the link check, the docs map and typos.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: changes
    uses: ./.github/workflows/changes.yml

  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all --check

  # Pedantic: the workspace's lints (Cargo.toml) turn it on.
  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install macroquad system libraries
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - run: cargo test --workspace --locked --no-fail-fast

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - run: cargo doc --workspace --no-deps --locked

  # The examples built for the web, as Pages publishes them (pages.yml);
  # natively, `test` builds and plays them.
  wasm:
    name: wasm
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `check --target` checks the controls in the game's tool program,
      # which builds natively.
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - name: Hello, Grid fits every target it lists
        working-directory: examples/hello-grid
        run: cargo shuyi check --target all
      - name: Build Hello, Grid for the web
        working-directory: examples/hello-grid
        run: cargo shuyi web --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-grid-web
          path: examples/hello-grid/dist/web

  # `shuyi new` (ticket 1129): a game made from each template, on this
  # checkout of the engine, passes the gates its own CI runs. It builds in
  # this repository's target folder, which rust-cache keeps.
  templates:
    name: templates (${{ matrix.template }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        template: [grid, blank]
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TEMPLATE: ${{ matrix.template }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: template-${{ matrix.template }}
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - name: Make a game with shuyi new
        run: cargo run -q -p shuyi-cli --locked -- new "$TEMPLATE" "$RUNNER_TEMP/demo" --engine-path "$GITHUB_WORKSPACE"
      - name: Run its gates
        working-directory: ${{ runner.temp }}/demo
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo shuyi check
          cargo shuyi check --target all
          cargo shuyi check-keys
          cargo shuyi lint
      # Ticket 2548: a long name lays out the same, so the game's own fmt
      # gate passes whatever it is called.
      - name: A game with a long name passes cargo fmt
        run: |
          cargo run -q -p shuyi-cli --locked -- new "$TEMPLATE" "$RUNNER_TEMP/long" \
            --name "A Much Longer Game Name Than Demo, To Test" --engine-path "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/long" && cargo fmt --all --check
      # `shuyi lint` (ticket 2534): one finding each, with file and line,
      # for a hash map, a float, a clock and float arithmetic in the rules,
      # a screen crate under them, a key named in a screen and a screen's
      # literal text; without `rules` in shuyi.ron, a limit says so.
      - name: shuyi lint finds what breaks the game's code
        if: matrix.template == 'grid'
        working-directory: ${{ runner.temp }}/demo
        run: |
          cp -r crates "$RUNNER_TEMP/crates" && cp shuyi.ron "$RUNNER_TEMP/shuyi.ron"
          cat >> crates/rules/src/lib.rs <<'RUST'

          /// Breaks every rule the fence names.
          pub fn breaks_the_rules(tiles: &std::collections::BTreeMap<u8, u8>) -> usize {
              let _ = std::collections::HashMap::<u8, u8>::new();
              let _: f32 = 0.0;
              let _ = std::time::Instant::now();
              let _ = 1.5 * 2.0;
              tiles.len()
          }
          RUST
          echo 'shuyi-ui.workspace = true' >> crates/rules/Cargo.toml
          cat >> crates/game/src/stage.rs <<'RUST'

          /// Names a key and writes a screen's text.
          pub fn breaks_the_screens(buf: &mut GlyphBuffer, fg: shuyi_ui::frame::Rgb) {
              buf.print(0, 0, "Press Space to go", fg, fg);
          }
          RUST
          if cargo shuyi lint --json > lint.json; then
            cat lint.json
            echo "::error::shuyi lint passed on code that breaks the rules"
            exit 1
          fi
          found=$(jq -r '.result.findings[] | "\(.code) \(.file):\(.line)"' lint.json)
          echo "$found"
          for expected in 'SH2101 crates/game/src/stage.rs' 'SH2102 crates/game/src/stage.rs' \
            'SH2104 crates/rules/Cargo.toml:null'; do
            if ! grep -qF "$expected" <<< "$found"; then
              echo "::error::shuyi lint did not find: $expected"
              exit 1
            fi
          done
          if [ "$(grep -c '^SH2103 crates/rules/src/lib.rs:[0-9]' <<< "$found")" != 4 ]; then
            echo "::error::shuyi lint did not find the fence's four breaks, one each"
            exit 1
          fi
          jq -e '.result.findings[] | select(.code == "SH2104") | .command == "cargo tree -p demo-rules -i shuyi-ui"' lint.json
          rm -r crates && cp -r "$RUNNER_TEMP/crates" crates
          sed -i '/^    rules: /d' shuyi.ron
          cargo shuyi lint --json > lint.json
          jq -e '.ok and (.limits | any(test("names no rules package")))' lint.json
          cp "$RUNNER_TEMP/shuyi.ron" shuyi.ron
      # The rules crate's fence (ticket 2015, ADR-0032 §4): clippy names a
      # hash map, a float, a clock and float arithmetic in the rules, and
      # the layers test fails on a screen crate under them.
      - name: The rules crate's fence holds
        if: matrix.template == 'grid'
        working-directory: ${{ runner.temp }}/demo
        run: |
          lib=crates/rules/src/lib.rs
          cp "$lib" "$RUNNER_TEMP/lib.rs"
          cat >> "$lib" <<'RUST'

          /// Breaks every rule the fence names.
          pub fn breaks_the_rules(_tiles: &std::collections::HashMap<u8, u8>, x: f32) -> f32 {
              let _ = std::time::Instant::now();
              x + 1.5 * 2.0
          }
          RUST
          if cargo clippy -p demo-rules --message-format=short -- -D warnings 2> clippy.txt; then
            echo "::error::clippy passed on rules that break the fence"
            exit 1
          fi
          for message in \
            'disallowed type `std::collections::HashMap`' \
            'disallowed type `f32`' \
            'disallowed method `std::time::Instant::now`' \
            'floating-point arithmetic detected'; do
            if ! grep -qF "$message" clippy.txt; then
              cat clippy.txt
              echo "::error::clippy did not say: $message"
              exit 1
            fi
          done
          cp "$RUNNER_TEMP/lib.rs" "$lib"
          echo 'shuyi-ui.workspace = true' >> crates/rules/Cargo.toml
          if cargo test -p demo-rules --test layers > layers.txt 2>&1; then
            echo "::error::the layers test passed on rules that depend on shuyi-ui"
            exit 1
          fi
          if ! grep -qF 'demo-rules depends on shuyi-ui' layers.txt; then
            cat layers.txt
            echo "::error::the layers test did not name shuyi-ui"
            exit 1
          fi

  # The crates a Playdate game builds without `std` (ADR-0008 §5, ticket
  # 3005): built for a target that has no `std` at all, their tests run
  # without `std` on the host, and no `std::` path outside
  # `cfg(feature = "std")`.
  no-std:
    name: no-std
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p shuyi-core -p shuyi-ui -p shuyi-platform --no-default-features --target thumbv7em-none-eabihf --locked
      - run: cargo build -p shuyi-assets --no-default-features --target thumbv7em-none-eabihf --locked
      - run: cargo xtask check-no-std
      # The same tests as with `std`, the headless backend's included. The
      # test harness and the dev-dependencies bring `std` into the build,
      # and with it `std`'s own float methods, which win over the `Float`
      # trait the `no_std` code imports: those imports are unused here
      # only. The target build above denies every warning.
      - name: The tests without std
        env:
          RUSTFLAGS: -D warnings -A unused-imports
        run: cargo test -p shuyi-core -p shuyi-ui -p shuyi-platform --no-default-features --locked --no-fail-fast

  # The crates' layers as tools/layers.ron writes them (ticket 2015,
  # ADR-0032): which engine crate depends on which, the outside crates of
  # the pure ones, no device crate below any crate but the backend's, and
  # the float ban in the simulations. It replaces the `platform-deps` job.
  layers:
    name: layers
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo xtask check-layers

  # The public API of the crates a game uses (ticket 2010, ADR-0038): what
  # merging adds to each crate's listing (cargo-public-api) and its breaks
  # (cargo-semver-checks), against the base's tip, in the job summary. A
  # break needs a `Breaking:` line in the branch's ticket. On a pull
  # request HEAD is the merge commit and HEAD^1 the base's tip, as in
  # changes.yml.
  api:
    name: api
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.crates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: rustup show
      # The nightly, and the tools' versions below, are the consts in
      # crates/xtask/src/api.rs; they move with rust-toolchain.toml.
      - run: rustup toolchain install nightly-2026-07-06 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `shuyi-app`'s dependencies need them to be documented.
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-semver-checks@0.51.0
      # install-action doesn't carry cargo-public-api.
      - run: cargo install --locked cargo-public-api@0.52.0
      - name: Show the public API change
        env:
          HEAD_REF: ${{ github.head_ref }}
          # Warnings are the clippy and test jobs' gate: a lint only the
          # nightly has must not fail this job as a build error.
          RUSTFLAGS: ""
        run: cargo xtask api --base HEAD^1 --pr-branch "$HEAD_REF" --summary "$GITHUB_STEP_SUMMARY"

  # Licenses, advisories, bans and sources (deny.toml).
  deny:
    name: deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The workflows audited (ticket 2011, ADR-0037 §4): `.` collects every
  # `.github/workflows` folder below it, the templates' included. Findings
  # fail the job and show in its log; a finding wrong for this repository
  # goes in .github/zizmor.yml with why.
  zizmor:
    name: zizmor
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .
          min-severity: medium
          advanced-security: false

  # Dependencies no crate uses.
  machete:
    name: machete
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-machete
      - run: cargo machete

  # Coverage without the platform backend, a Clippy report, and the
  # SonarCloud scan (ticket 2007, ADR-0017; copied from the game's job).
  # The scan is skipped where the secret is absent, as on a fork's PR.
  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup show
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --exclude shuyi-app --locked --lcov --output-path lcov.info
      - name: Generate Clippy report for SonarCloud
        run: cargo clippy --workspace --all-targets --locked --message-format=json > clippy.json
        continue-on-error: true
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The ticket lint, the Markdown links, the pins (`check-pins`), the
  # pinned Rust (`check-toolchain`), the docs map (`check-docs`) and typos.
  # Cheap, and tickets and
  # docs are what they check, so this always runs: never gated on
  # `needs.changes` (game ADR-0014), like the game's `tickets` job.
  tickets:
    name: tickets
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
      EVENT_NAME: ${{ github.event_name }}
      # For `gh api` on the game's tickets (`game#NNNN` ids). Without access
      # to the game repository the lint warns and skips those ids.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run ticket lint
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            cargo xtask ticket-lint --pr-branch "$HEAD_REF"
          else
            cargo xtask ticket-lint
          fi
      - name: Check Markdown links
        run: cargo xtask check-links
      - name: Check the actions' pins and the templates' requirements
        run: cargo xtask check-pins
      - name: Check the pinned Rust
        run: cargo xtask check-toolchain
      - name: Check the docs map
        run: cargo xtask check-docs
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: typos
      - name: Check spelling
        run: typos

  # Single required check for this workflow. Matrix jobs skipped by `if:`
  # report one check with an unexpanded name, never the per-leg names, so
  # branch protection requires this job instead (game ADR-0014).
  ci-result:
    name: ci-result
    if: always()
    needs: [changes, fmt, clippy, test, docs, wasm, templates, no-std, layers, api, deny, zizmor, machete, coverage, tickets]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi
