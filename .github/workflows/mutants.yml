name: Mutants

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    if: github.event_name == 'pull_request'
    name: changes
    uses: ./.github/workflows/changes.yml

  # Counts the mutants in the PR's diff and picks how many shards to run
  # them on. Nothing is built here: `--list` only reads the sources.
  plan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: mutants (diff, plan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mutants: ${{ steps.count.outputs.mutants }}
      shards: ${{ steps.count.outputs.shards }}
      of: ${{ steps.count.outputs.of }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup show
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-mutants
      # The code came from the game's repository with its history (the
      # game's ticket 1131), where each line passed this gate PR by PR. So
      # while the base branch doesn't hold that history yet, the diff is
      # from the code as it left the game (`CARVED`, the carved history's
      # tip), not from a base with no code at all. Once the move is merged
      # the base holds it and this is the plain diff.
      - name: Compute diff against base
        env:
          BASE_REF: ${{ github.base_ref }}
          CARVED: 986e0342d4cd7c249871162baad07bff096a93e2
        run: bash .github/mutants-diff.sh > git.diff
      # 1 shard up to 40 mutants, 4 up to 160, otherwise 8: every shard pays
      # for its own setup and first full build, so a small diff gets one.
      - name: Count mutants and pick shards
        id: count
        run: |
          set -euo pipefail
          mutants=0
          if [ -s git.diff ]; then
            cargo mutants --in-diff git.diff --list > mutants.txt
            mutants=$(wc -l < mutants.txt)
          fi
          if [ "$mutants" -le 40 ]; then
            of=1
          elif [ "$mutants" -le 160 ]; then
            of=4
          else
            of=8
          fi
          shards=$(seq -s, 0 $((of - 1)))
          echo "$mutants mutants in the diff: $of shard(s)"
          {
            echo "mutants=$mutants"
            echo "of=$of"
            echo "shards=[$shards]"
          } >> "$GITHUB_OUTPUT"

  # The unmutated tree must pass under nextest, once for the whole run,
  # beside the shards instead of before each of them (game ticket 0127). It
  # runs every crate the mutants can be in, with the shards' profile.
  baseline:
    needs: [changes, plan]
    if: needs.plan.outputs.mutants != '0'
    name: mutants (diff, baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: Run the tests unmutated
        run: cargo nextest run --workspace --exclude shuyi-app --profile mutants

  pr:
    needs: [changes, plan]
    if: needs.plan.outputs.mutants != '0'
    name: mutants (diff, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Compute diff against base
        env:
          BASE_REF: ${{ github.base_ref }}
          CARVED: 986e0342d4cd7c249871162baad07bff096a93e2
        run: bash .github/mutants-diff.sh > git.diff
      # Round-robin: mutant i runs on shard i % n, so one slow crate is
      # spread over every shard. nextest stops at the first failing test, so
      # a caught mutant does not pay for the whole suite. Two mutants at a
      # time (never more: cargo-mutants warns of timeouts), each in its own
      # copy of the tree (game ADR-0047, game ADR-0073).
      #
      # The `mutants` nextest profile (.config/nextest.toml) stops at the
      # first failure. Incremental builds are back on (rust-cache turns them
      # off for the job; the mutants build in their own copies under /tmp,
      # which are never cached), so a mutant recompiles only what changed.
      # The unmutated run is the `baseline` job, so the timeout is fixed:
      # 720 s is the game's (game ticket 0127), which covers a crate whose
      # tests run for 240 s unmutated; the engine's run for far less.
      - name: Run cargo mutants on this shard of the diff
        env:
          SHARD: ${{ matrix.shard }}
          OF: ${{ needs.plan.outputs.of }}
          NEXTEST_PROFILE: mutants
        run: >
          CARGO_INCREMENTAL=1
          cargo mutants --in-diff git.diff --jobs 2
          --shard "$SHARD/$OF" --sharding round-robin
          --test-tool=nextest --baseline=skip --timeout 720 -vV
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-pr-${{ matrix.shard }}-${{ github.run_id }}
          path: mutants.out
          if-no-files-found: ignore

  # Single required check for the PR run (game ADR-0014): the shards are
  # matrix legs, so branch protection requires this job.
  mutants-result:
    name: mutants (diff)
    if: always() && github.event_name == 'pull_request'
    needs: [changes, plan, baseline, pr]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A mutation job failed or was cancelled."
            exit 1
          fi

  weekly-baseline:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: mutants (full, baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-mutants
      - name: Run baseline once
        run: cargo mutants --baseline=run --list

  weekly:
    needs: weekly-baseline
    name: mutants (full, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-mutants
      - name: Run cargo mutants shard
        continue-on-error: true
        run: cargo mutants --shard ${{ matrix.shard }}/4 --baseline=skip
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-weekly-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: mutants.out
          if-no-files-found: ignore
