name: sound-trace

# Scratch (ticket 2050, never merged): the in-house web backend's start, traced.

on:
  push:
    branches: [t2050-trace]

permissions:
  contents: read

jobs:
  trace:
    name: trace ${{ matrix.copy }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Set up Linux
        run: bash scripts/setup-linux.sh
      - name: Install the capture's tools and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils libasound2-plugins libpulse0 vorbis-tools
          python3 -m venv "$RUNNER_TEMP/capture"
          "$RUNNER_TEMP/capture/bin/pip" install --require-hashes -r tools/web-check/requirements.txt
          "$RUNNER_TEMP/capture/bin/python" -m playwright install --with-deps chromium
      - name: The corpus
        run: cargo xtask sound-parity corpus --out target/sound-parity --oracle
      - name: Build the in-house page
        run: |
          cargo build -p shuyi-app --example sound_probe --features sound-probe,in-house-sound \
            --target wasm32-unknown-unknown --release --locked
          page=target/sound-parity-page-new
          rm -rf "$page"
          mkdir -p "$page"
          cp target/wasm32-unknown-unknown/release/examples/sound_probe.wasm crates/cli/web/*.js "$page/"
          sed -e 's/%TITLE%/Sound probe/' -e 's/%WASM%/sound_probe.wasm/' crates/cli/web/index.html > "$page/index.html"
      - name: Record, traced
        run: |
          "$RUNNER_TEMP/capture/bin/python" tools/sound-parity/trace.py --dir target/sound-parity \
            --page target/sound-parity-page-new --rounds 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trace-${{ matrix.copy }}
          path: target/sound-parity/trace
